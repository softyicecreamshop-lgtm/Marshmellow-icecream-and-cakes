    addToOrderCart(pid, q); closeModal();
  };
};
function addToOrderCart(pid, qty){
  const p = State.products[pid]; if(!p) return;
  const cat = State.categories[p.categoryId] || {name:'Other'};
  const sub = p.subcategoryId ? subName(p.subcategoryId) : (isLegacyProduct(p)?'General':'');
  const price = productPrice(p);
  const existing = State.orderCart.find(c=>c.pid===pid);
  const curQty = existing ? existing.qty : 0;
  const maxStock = productStock(p);
  if (curQty + qty > maxStock) { toast('Only ' + maxStock + ' in stock', 'err'); return; }
  if(existing) existing.qty += qty;
  else State.orderCart.push({ pid, productName:p.name, categoryId:p.categoryId, categoryName:cat.name, subcategoryId:p.subcategoryId||'', subcategoryName:sub, price, qty });
  renderOrdersCart();
}
function orderCartSubtotal(){ return State.orderCart.reduce((a,c)=>a+c.price*c.qty,0); }
function orderDiscountClamped(){ const sub = orderCartSubtotal(); return Math.min(Math.max(0, Number(State.orderDiscount)||0), sub); }

function renderOrdersCart(){
  const el = document.getElementById('orderCartItems'); const cntEl = document.getElementById('orderCartCount');
  if(!el) return;
  if(!State.orderCart.length){ el.innerHTML = '<div class="cart-empty"><span class="em-icon">📋</span><b>No items</b>Tap a product to add it.</div>'; }
  else { el.innerHTML = State.orderCart.map((c,i)=>`
    <div class="cart-line">
      <div class="cl-info">
        <div class="cl-name">${esc(c.productName)}</div>
        <div class="cl-meta">${c.subcategoryName?esc(c.subcategoryName)+' · ':''}${fmtINR(c.price)}</div>
      </div>
      <div class="qty-ctl">
        <button onclick="changeOrderQty(${i},-1)">−</button><span>${c.qty}</span><button onclick="changeOrderQty(${i},1)">+</button>
      </div>
    </div>`).join(''); }
  if(cntEl) cntEl.textContent = State.orderCart.reduce((a,c)=>a+c.qty,0) + ' items';
  const subEl = document.getElementById('orderCartSubtotal');
  const totEl = document.getElementById('orderCartTotal');
  const sub = orderCartSubtotal();
  const disc = orderDiscountClamped();
  if (subEl) subEl.textContent = fmtINR(sub);
  if (totEl) totEl.textContent = fmtINR(sub - disc);
}
window.changeOrderQty = (i, delta)=>{
  const line = State.orderCart[i]; if (!line) return;
  if (delta > 0) {
    const p = State.products[line.pid];
    const max = p ? productStock(p) : line.qty;
    if (line.qty + delta > max) { toast('Only ' + max + ' in stock', 'err'); return; }
  }
  line.qty += delta;
  if(line.qty <= 0) State.orderCart.splice(i,1);
  const sub = orderCartSubtotal();
  if (State.orderDiscount > sub) State.orderDiscount = sub;
  const dInput = document.getElementById('orderCartDiscountInput'); if (dInput) dInput.value = State.orderDiscount;
  renderOrdersCart();
};
window.setOrderDiscount = (val)=>{
  const sub = orderCartSubtotal();
  let d = Number(val); if (isNaN(d) || d < 0) d = 0;
  if (d > sub) { d = sub; const inp = document.getElementById('orderCartDiscountInput'); if (inp) inp.value = d; }
  State.orderDiscount = d;
  renderOrdersCart();
};
window.setOrderPay = (pm)=>{
  State.orderPay = pm;
  $$('#orderPayMethods button').forEach(b=>b.classList.toggle('active', b.dataset.pay === pm));
};

window.saveNewOrder = async ()=>{
  if (State.busy) return;
  if (!State.orderCart.length) { toast('Add items to order','err'); return; }
  if (!State.orderDate) { toast('Select scheduled date','err'); return; }
  if (!State.orderTime) { toast('Select scheduled time','err'); return; }
  const custName = ($('#orderCustName')?.value||'').trim();
  const custPhone = ($('#orderCustPhone')?.value||'').trim();
  const orderNote = ($('#orderNoteInput')?.value||'').trim();
  const subtotal = orderCartSubtotal();
  const discount = orderDiscountClamped();
  const total = subtotal - discount;
  const orderId = 'ORD_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  const order = {
    orderId,
    customerName: custName || 'Walk-in',
    customerPhone: custPhone || '',
    customerId: State.orderCustomer?.id || null,
    items: State.orderCart.map(c=>({ pid:c.pid, productName:c.productName, categoryId:c.categoryId, categoryName:c.categoryName, subcategoryId:c.subcategoryId||'', subcategoryName:c.subcategoryName||'', price:c.price, qty:c.qty })),
    subtotal, discount, total,
    paymentMethod: State.orderPay,
    note: orderNote,
    scheduledDate: State.orderDate,
    scheduledTime: State.orderTime,
    status: 'pending',
    createdAt: nowISO(),
    createdBy: State.user.uid,
    createdByName: State.profile?.name || '',
    completedAt: null,
    cancelledAt: null,
    saleId: null,
  };
  State.busy = true; showLoading(true);
  try {
    await set(ref(db,'orders/'+orderId), order);
    await recordActivity({
      type:'order_created',
      description:'Created order for '+fmtDate(State.orderDate)+' '+State.orderTime,
      recordId: orderId,
      diff: buildDiff({}, {
        customerName: order.customerName,
        customerPhone: order.customerPhone,
        scheduledDate: order.scheduledDate,
        scheduledTime: order.scheduledTime,
        itemsSummary: summarizeItems(order.items),
        subtotal, discount, total,
        paymentMethod: order.paymentMethod,
        note: order.note
      })
    });
    toast('Order created: ' + fmtINR(total));
    State.orderCart = []; State.orderDiscount = 0; State.orderNote = ''; State.orderCustomer = null;
    State.orderTime = '18:00';
    setOrderSubTab('list');
  } catch(e){
    toast('Failed: ' + (e.message || e.code || 'unknown'),'err');
  } finally { State.busy = false; showLoading(false); }
};

function renderOrdersList(){
  const el = document.getElementById('ordersBody'); if (!el) return;
  const bd = activeBusinessDate();
  if (State.orderDateFilterMode === 'today' && !State.orderCustomDate) State.orderCustomDate = bd;
  const todayVal = State.orderDateFilterMode === 'custom' ? State.orderCustomDate :
                    (State.orderDateFilterMode === 'today' ? bd :
                    (State.orderDateFilterMode === 'tomorrow' ? (()=>{ const d = new Date(bd); d.setDate(d.getDate()+1); return dateToISO(d); })() : ''));
  el.innerHTML = `
    <div class="filter-bar">
      <div class="pay-filters" style="margin-bottom:0;overflow:visible">
        <button class="pay-filter-pill ${State.orderDateFilterMode==='today'?'active':''}" onclick="setOrderDateFilter('today')">📅 Today</button>
        <button class="pay-filter-pill ${State.orderDateFilterMode==='tomorrow'?'active':''}" onclick="setOrderDateFilter('tomorrow')">➡️ Tomorrow</button>
        <button class="pay-filter-pill ${State.orderDateFilterMode==='all'?'active':''}" onclick="setOrderDateFilter('all')">📋 All Dates</button>
      </div>
      <input id="orderCustomDate" type="date" class="input" value="${esc(todayVal||'')}" onchange="setOrderDateFilter('custom',this.value)" title="Custom Date">

    </div>
    <div id="ordersListBody"></div>`;
  drawOrdersList();
}
window.setOrderDateFilter = (mode, customDate)=>{
  State.orderDateFilterMode = mode;
  State.orderPage = 1;
  if (mode === 'custom' && customDate) State.orderCustomDate = customDate;
  else if (mode === 'today') State.orderCustomDate = activeBusinessDate();
  else if (mode === 'tomorrow') { const d = new Date(activeBusinessDate()); d.setDate(d.getDate()+1); State.orderCustomDate = dateToISO(d); }
  else if (mode === 'all') State.orderCustomDate = '';
  renderOrdersList();
};

function filteredOrdersList(){
  let list = Object.entries(State.orders||{}).map(([id,o])=>({id,...o}));
  const mode = State.orderDateFilterMode;
  let targetDate = '';
  if (mode === 'today') targetDate = activeBusinessDate();
  else if (mode === 'tomorrow') { const d = new Date(activeBusinessDate()); d.setDate(d.getDate()+1); targetDate = dateToISO(d); }
  else if (mode === 'custom') targetDate = State.orderCustomDate || '';
  if (targetDate) list = list.filter(o => o.scheduledDate === targetDate);
  const q = (window._orderSearchVal||'').toLowerCase();
  if (q) list = list.filter(o => [o.customerName, o.customerPhone, o.orderId, o.id].filter(Boolean).join(' ').toLowerCase().includes(q));
  list.sort((a,b)=>{
    const ka = (a.scheduledDate||'') + (a.scheduledTime||'');
    const kb = (b.scheduledDate||'') + (b.scheduledTime||'');
    if (ka !== kb) return kb.localeCompare(ka);
    return new Date(b.createdAt||0) - new Date(a.createdAt||0);
  });
  return list;
}

function drawOrdersList(){
  const el = document.getElementById('ordersListBody'); if (!el) return;
  const list = filteredOrdersList();
  const total = list.length;
  if (!total) { el.innerHTML = `<div class="card"><div class="empty"><span class="em-icon">📋</span><b>No orders match</b>Try a different date filter or create a new order.</div></div>`; return; }
  const totalPages = Math.max(1, Math.ceil(total / State.orderPerPage));
  if (State.orderPage > totalPages) State.orderPage = totalPages;
  if (State.orderPage < 1) State.orderPage = 1;
  const start = (State.orderPage - 1) * State.orderPerPage;
  const pageItems = list.slice(start, start + State.orderPerPage);
  const bd = activeBusinessDate();
  const nowHHMM = new Date().toTimeString().slice(0,5);
  const cards = pageItems.map(o=>{
    const bucket = orderDueBucket(o, bd, nowHHMM);
    const cls = o.status==='completed' ? 'completed' : o.status==='cancelled' ? 'cancelled' : (bucket || '');
    const itemsSummary = (o.items||[]).map(i=>`${esc(i.productName)} ×${i.qty}`).join(', ');
    const actions = o.status === 'pending' ? `
      <button class="btn btn-ghost btn-sm" onclick="viewOrderDetails('${o.id}')">View</button>
      <button class="btn btn-ghost btn-sm" onclick="confirmEditOrder('${o.id}')">Edit</button>
      <button class="btn btn-ghost btn-sm" onclick="confirmCancelOrder('${o.id}')">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="confirmMarkOrderDone('${o.id}')">Mark Done</button>
    ` : `<button class="btn btn-ghost btn-sm" onclick="viewOrderDetails('${o.id}')">View</button>`;
    return `<div class="order-card ${cls}">
      <div class="order-row-top">
        <div style="min-width:0;flex:1">
          <div class="order-id">#${esc((o.orderId||o.id||'').slice(-8))} ${orderStatusBadge(o.status)}</div>
          <div class="order-cust">${esc(o.customerName||'Walk-in')}${o.customerPhone?' · '+esc(o.customerPhone):''}</div>
        </div>
        <div style="text-align:right">
          <div class="order-when ${bucket}">${esc(o.scheduledTime||'—')}</div>
          <div style="font-size:11px;color:var(--muted);font-weight:700;margin-top:2px">${fmtDate(o.scheduledDate)}</div>
        </div>
      </div>
      <div class="order-items">${itemsSummary}</div>
      <div class="order-meta">
        <span class="badge badge-orange">${fmtINR(o.total)}</span>
        <span class="badge ${o.paymentMethod==='Pending'?'badge-pending':'badge-teal'}">${esc(o.paymentMethod||'Cash')}</span>
        ${o.note?`<span style="font-size:11.5px;color:var(--muted);font-weight:600">📝 ${esc(o.note.slice(0,50))}${o.note.length>50?'…':''}</span>`:''}
      </div>
      <div class="order-actions">${actions}</div>
    </div>`;
  }).join('');
  const perPageOptions = [10,20,30,40,50].map(n=>`<option value="${n}" ${n===State.orderPerPage?'selected':''}>${n} / page</option>`).join('');
  const pageBtns = buildPageButtons(State.orderPage, totalPages, 'ordersGoToPage');
  el.innerHTML = `
    <div class="card">
      <div style="margin-bottom:14px;color:var(--brown);font-size:13px"><b>${total}</b> order${total===1?'':'s'}</div>
      ${cards}
      <div class="pagination">
        <div class="pg-info">Showing <b>${start+1}–${Math.min(start+State.orderPerPage, total)}</b> of <b>${total}</b> orders</div>
        <div class="pg-controls">
          <select class="pg-perpage" onchange="ordersSetPerPage(this.value)">${perPageOptions}</select>
          <button class="pg-btn" onclick="ordersGoToPage(${State.orderPage-1})" ${State.orderPage<=1?'disabled':''}>← Prev</button>
          ${pageBtns}
          <button class="pg-btn" onclick="ordersGoToPage(${State.orderPage+1})" ${State.orderPage>=totalPages?'disabled':''}>Next →</button>
        </div>
      </div>
    </div>`;
}

window.editOrderQty = (idx, delta)=>{
  const o = State.editingOrder; if (!o || !o.items[idx]) return;
  const line = o.items[idx];
  if (delta > 0) {
    const p = State.products[line.pid];
    const avail = p ? productStock(p) : line.qty;
    if (line.qty + delta > avail) { toast('Only ' + avail + ' in stock', 'err'); return; }
  }
  line.qty = Math.max(0, line.qty + delta);
  if (line.qty === 0) o.items.splice(idx, 1);
  renderEditOrderModal();
};
window.editOrderRemoveLine = (idx)=>{ const o = State.editingOrder; if(!o) return; o.items.splice(idx, 1); renderEditOrderModal(); };
window.editOrderDiscount = (val)=>{
  const o = State.editingOrder; if (!o) return;
  const subtotal = o.items.reduce((a,i)=>a+i.price*i.qty,0);
  let d = Number(val); if (isNaN(d) || d < 0) d = 0;
  if (d > subtotal) { d = subtotal; const inp = document.getElementById('eoDiscountInput'); if (inp) inp.value = d; }
  o.discount = d;
  renderEditOrderModal();
};
window.editOrderSetPay = (pm, btn)=>{
  const o = State.editingOrder; if (!o) return;
  o.paymentMethod = pm;
  $$('#eoPayMethods button').forEach(b=>b.classList.toggle('active', b===btn));
};
window.openAddProductToEditOrder = ()=>{
  const o = State.editingOrder; if (!o) return;
  const rows = Object.entries(State.products).filter(([id,p])=>p.active!==false && productStock(p) > 0)
    .map(([id,p])=>({ id, p, cat: State.categories[p.categoryId]?.name||'', sub: p.subcategoryId?subName(p.subcategoryId):'', stock: productStock(p), price: productPrice(p) }))
    .sort((a,b)=> (a.cat+a.sub+a.p.name).localeCompare(b.cat+b.sub+b.p.name));
  if (!rows.length) { toast('No products with stock available','err'); return; }
  const listHTML = rows.map(r=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--cream-2);border-radius:9px;margin-bottom:6px;border:1px solid var(--line-2)">
    <div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:12.5px;color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.p.name)}</div>
      <div style="font-size:10.5px;color:var(--muted);font-weight:600">${esc(r.cat)}${r.sub?' · '+esc(r.sub):''} · Stock ${r.stock}</div>
    </div>
    <div style="font-weight:800;color:var(--orange);font-size:12.5px;font-family:var(--f-display)">${fmtINR(r.price)}</div>
    <button class="btn btn-primary btn-sm" onclick="editOrderAddLine('${r.id}')">Add</button>
  </div>`).join('');

    `<button class="btn btn-ghost" onclick="renderEditOrderModal()">← Back</button>`);
};
window.editOrderAddLine = (pid)=>{
  const o = State.editingOrder; if (!o) return;
  const p = State.products[pid]; if (!p) return;
  const existing = o.items.find(i=>i.pid===pid);
  const avail = productStock(p);
  if (existing) {
    if (existing.qty + 1 > avail) { toast('Only ' + avail + ' in stock', 'err'); return; }
    existing.qty += 1;
  } else {
    if (avail < 1) { toast('Out of stock','err'); return; }
    const cat = State.categories[p.categoryId] || {name:'Other'};
    const sub = p.subcategoryId ? subName(p.subcategoryId) : (isLegacyProduct(p)?'General':'');
    o.items.push({ pid, productName:p.name, categoryId:p.categoryId, categoryName:cat.name, subcategoryId:p.subcategoryId||'', subcategoryName:sub, price:productPrice(p), qty:1 });
  }
  renderEditOrderModal();
};
window.cancelEditOrder = ()=>{ State.editingOrder = null; State.editingOrderId = null; closeModal(); };

window.saveEditedOrder = async ()=>{
  if (State.busy) return;
  const o = State.editingOrder; if (!o) return;
  if (!o.items.length) { toast('Order must have at least one item','err'); return; }
  if (!o.scheduledDate || !o.scheduledTime) { toast('Scheduled date/time required','err'); return; }
  const subtotal = o.items.reduce((a,i)=>a+i.price*i.qty,0);
  const discount = Math.min(Math.max(0, Number(o.discount)||0), subtotal);
  const total = subtotal - discount;

  const before = State.orders[o.orderId] || {};
  const beforeSnapshot = {
    customerName: before.customerName, customerPhone: before.customerPhone,
    scheduledDate: before.scheduledDate, scheduledTime: before.scheduledTime,
    subtotal: before.subtotal, discount: before.discount, total: before.total,
    paymentMethod: before.paymentMethod,
    itemsSummary: summarizeItems(before.items),
    note: before.note
  };
  const afterSnapshot = {
    customerName: o.customerName || 'Walk-in', customerPhone: o.customerPhone || '',
    scheduledDate: o.scheduledDate, scheduledTime: o.scheduledTime,
    subtotal, discount, total,
    paymentMethod: o.paymentMethod,
    itemsSummary: summarizeItems(o.items),
    note: o.note || ''
  };

  State.busy = true; showLoading(true);
  try {
    await update(ref(db,'orders/'+o.orderId), {
      items: o.items.map(i=>({ pid:i.pid, productName:i.productName, categoryId:i.categoryId, categoryName:i.categoryName, subcategoryId:i.subcategoryId||'', subcategoryName:i.subcategoryName||'', price:i.price, qty:i.qty })),
      subtotal, discount, total,
      paymentMethod: o.paymentMethod,
      note: o.note || '',
      customerName: o.customerName || 'Walk-in',
      customerPhone: o.customerPhone || '',
      scheduledDate: o.scheduledDate,
      scheduledTime: o.scheduledTime,
      lastModifiedAt: nowISO(),
      lastModifiedBy: State.user.uid,
      lastModifiedByName: State.profile?.name || '',
    });
    const diff = buildDiff(beforeSnapshot, afterSnapshot);
    await recordActivity({
      type:'order_edited', description:'Edited order '+((o.orderId||'').slice(-8)),
      recordId: o.orderId, diff
    });
    toast('Order updated');
    State.editingOrder = null; State.editingOrderId = null;
    closeModal();
  } catch (e) {
    toast('Failed: ' + (e.message || e.code || 'unknown'),'err');
  } finally { State.busy = false; showLoading(false); }
};

window.confirmMarkOrderDone = (id)=>{
  const o = State.orders[id]; if (!o) return;
  if (o.status !== 'pending') { toast('Only pending orders can be completed','err'); return; }
  if (!State.activeDayId) { toast('Please start a business day before completing orders','err'); return; }
  const bd = State.businessDays[State.activeDayId];
  if (!bd) { toast('Active business day not found','err'); return; }
  const shortages = [];
  for (const it of (o.items||[])) {
    const p = State.products[it.pid];
    const avail = p ? productStock(p) : 0;
    if (avail < it.qty) shortages.push(`${it.productName} (have ${avail}, need ${it.qty})`);
  }
  if (shortages.length) { toast('Insufficient stock: ' + shortages.join(', '), 'err'); return; }
  openModal('Mark Order as Done?',
    `<p style="font-size:14px;line-height:1.65;color:var(--brown)">This will convert the order into a completed sale.</p>
     <div style="margin-top:14px;padding:12px 14px;background:var(--cream-2);border-radius:var(--r-sm);font-size:12.5px;color:var(--brown);line-height:1.6">
       <b>Order:</b> ${esc((o.orderId||id).slice(-8))} · ${fmtINR(o.total)}<br>
       <b>Customer:</b> ${esc(o.customerName||'Walk-in')}<br>
       <b>Business Day:</b> ${fmtDate(bd.businessDate)}<br><br>
       Inventory will be deducted for all items in this order.
     </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" id="confirmDoneBtn">Yes, Mark Done</button>`);
  $('#confirmDoneBtn').onclick = ()=>{ closeModal(); markOrderDone(id); };
};

window.markOrderDone = async (id)=>{
  if (State.busy) return;
  const o = State.orders[id]; if (!o) return;
  if (o.status !== 'pending') { toast('Order is not pending','err'); return; }
  if (!State.activeDayId) { toast('No active business day','err'); return; }
  const bd = State.businessDays[State.activeDayId]; if (!bd) return;
  State.busy = true; showLoading(true);
  try {
    const statusRef = ref(db, 'orders/'+id+'/status');
    const tx = await runTransaction(statusRef, (cur)=>{
      if (cur !== 'pending') return;
      return 'completed';
    });
    if (!tx.committed) { toast('Order already processed by another device','err'); return; }
    const deductions = [];
    try {
      for (const it of (o.items||[])) {
        const p = State.products[it.pid];
        const from = p ? productStock(p) : 0;
        const res = await adjustProductStock(it.pid, -it.qty, { productName: it.productName, from, reason: 'Order completed '+id, refId: id });
        if (!res.ok) throw new Error('Stock deduction failed for ' + it.productName);
        deductions.push({ pid: it.pid, qty: it.qty });
      }
      const saleId = id;
      const sale = {
        saleId, type:'scheduled_order', orderId: id,
        businessDayId: State.activeDayId, businessDate: bd.businessDate,
        date: bd.businessDate, dateTime: nowISO(),
        createdBy: o.createdBy, createdByName: o.createdByName || '',
        completedBy: State.user.uid, completedByName: State.profile?.name || '',
        items: (o.items||[]).map(i=>({ ...i })),
        subtotal: o.subtotal, discount: o.discount || 0, total: o.total,
        paymentMethod: o.paymentMethod, payments: { [o.paymentMethod]: o.total },
        note: o.note || '',
        customerId: o.customerId || null, customerName: o.customerName || 'Walk-in',
        scheduledDate: o.scheduledDate, scheduledTime: o.scheduledTime,
        cancelled: false,
      };
      await set(ref(db,'sales/'+saleId), sale);
      await update(ref(db,'orders/'+id), {
        status: 'completed', completedAt: nowISO(),
        completedBy: State.user.uid, completedByName: State.profile?.name || '',
        saleId, businessDayId: State.activeDayId, businessDate: bd.businessDate,
      });
      if (o.customerId) {
        const c = State.customers[o.customerId] || {};
        await update(ref(db,'customers/'+o.customerId), {
          totalPurchases: (Number(c.totalPurchases)||0) + (Number(o.total)||0),
          lastPurchase: bd.businessDate
        });
      }
      await recordActivity({
        type:'order_completed',
        description:'Completed order '+((o.orderId||id).slice(-8))+' → sale '+fmtINR(o.total),
        recordId: id,
        diff: buildDiff(
          { itemsSummary:'—', total:0, paymentMethod:'—', customerName: o.customerName },
          { itemsSummary: summarizeItems(o.items), total:o.total, paymentMethod:o.paymentMethod, customerName:o.customerName }
        ),
        details:{ saleId, total:o.total }
      });
      toast('Order completed & added to sales');
    } catch (e) {
      for (const d of deductions) { try { await adjustProductStock(d.pid, d.qty, { reason:'Rollback', refId:'rollback-'+id }); } catch(_){} }
      try { await runTransaction(statusRef, ()=>{ return 'pending'; }); } catch(_){}
      throw e;
    }
  } catch (e) {
    toast('Failed: ' + (e.message || e.code || 'unknown'),'err');
  } finally { State.busy = false; showLoading(false); }
};

window.confirmCancelOrder = (id)=>{
  const o = State.orders[id]; if (!o) return;
  if (o.status !== 'pending') { toast('Only pending orders can be cancelled','err'); return; }
  openModal('Cancel Order?',
    `<p style="font-size:14px;line-height:1.65;color:var(--brown)">This will mark the order as cancelled. It will not be added to Sales Data.</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Keep Order</button>
     <button class="btn btn-danger" id="confirmCancelBtn">Yes, Cancel Order</button>`);
  $('#confirmCancelBtn').onclick = async ()=>{
    closeModal(); State.busy = true; showLoading(true);
    try {
      const statusRef = ref(db, 'orders/'+id+'/status');
      const tx = await runTransaction(statusRef, (cur)=>{
        if (cur !== 'pending') return;
        return 'cancelled';
      });
      if (!tx.committed) { toast('Order already processed','err'); return; }
      await update(ref(db,'orders/'+id), { cancelledAt: nowISO(), cancelledBy: State.user.uid });
      await recordActivity({
        type:'order_cancelled', description:'Cancelled order '+((o.orderId||id).slice(-8)),
        recordId: id,
        diff: buildDiff({ status:'pending' }, { status:'cancelled' })
      });
      toast('Order cancelled');
    } catch (e) {
      toast('Failed: ' + (e.message || e.code || 'unknown'),'err');
    } finally { State.busy = false; showLoading(false); }
  };
};

/* ============================================================
   SALES DATA (with Edit + Delete + A4 Print)
   ============================================================ */
function renderSales(){
  const el = $('#pageContent');
  if (State.salesDate === undefined) State.salesDate = activeBusinessDate();
  el.innerHTML = `
    <div class="filter-bar">
      <input id="salesSearch" class="input" placeholder="🔍 Search product / customer / staff" value="${esc(State.salesSearch||'')}">
      <input id="salesDate" class="input" type="date" value="${esc(State.salesDate||'')}">
      <button class="btn btn-ghost btn-sm" onclick="State.salesDate='';document.getElementById('salesDate').value='';drawSalesTable();drawPayFilters();">All Dates</button>
      ${isAdmin()?'<button class="btn btn-ghost btn-sm" onclick="exportCSV(\'sales\')">⬇️ Export CSV</button>':''}
    </div>
    <div class="pay-filters" id="salesPayFilters"></div>
    <div class="card"><div id="salesTable"></div></div>`;
  $('#salesSearch').oninput = (e)=>{ State.salesSearch = e.target.value; State.salesPage = 1; drawSalesTable(); };
  $('#salesDate').onchange = (e)=>{ State.salesDate = e.target.value; State.salesPage = 1; drawSalesTable(); drawPayFilters(); };
  drawPayFilters(); drawSalesTable();
}
function filteredSalesList(){
  let list = Object.entries(State.sales||{}).map(([id,s])=>({id,...s})).filter(s=>!s.cancelled);
  if (State.salesDate) list = list.filter(s=> (s.businessDate||s.date) === State.salesDate);
  if (State.salesPayFilter && State.salesPayFilter !== 'All') list = list.filter(s => (s.paymentMethod||'Cash') === State.salesPayFilter);
  if (State.salesSearch) {
    const q = State.salesSearch.toLowerCase();
    list = list.filter(s=>{
      const hay = [s.customerName, s.createdByName, s.paymentMethod, s.note, ...(s.items||[]).map(i=>i.productName)].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  list.sort((a,b)=> new Date(b.dateTime||b.createdAt||0) - new Date(a.dateTime||a.createdAt||0));
  return list;
}
function drawPayFilters(){
  const el = document.getElementById('salesPayFilters'); if (!el) return;
  const base = Object.entries(State.sales||{}).map(([id,s])=>({id,...s})).filter(s=>!s.cancelled);
  let scoped = base;
  if (State.salesDate) scoped = scoped.filter(s => (s.businessDate||s.date) === State.salesDate);
  if (State.salesSearch) {
    const q = State.salesSearch.toLowerCase();
    scoped = scoped.filter(s=>{
      const hay = [s.customerName, s.createdByName, s.paymentMethod, s.note, ...(s.items||[]).map(i=>i.productName)].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  const counts = { All: scoped.length, Cash:0, UPI:0, Card:0, Pending:0 };
  scoped.forEach(s=>{ const m = s.paymentMethod||'Cash'; counts[m] = (counts[m]||0)+1; });
  const opts = [{v:'All',label:'All',icon:'🧾'},{v:'Cash',label:'Cash',icon:'💵'},{v:'UPI',label:'UPI',icon:'📱'},{v:'Card',label:'Card',icon:'💳'},{v:'Pending',label:'Pending',icon:'⏳'}];
  el.innerHTML = opts.map(o=>`<button class="pay-filter-pill ${State.salesPayFilter===o.v?'active':''}" onclick="setSalesPayFilter('${o.v}')">${o.icon} ${o.label} <span class="cnt">${counts[o.v]||0}</span></button>`).join('');
}
window.setSalesPayFilter = (v)=>{ State.salesPayFilter = v; State.salesPage = 1; drawPayFilters(); drawSalesTable(); };
function drawSalesTable(){
  const el = $('#salesTable'); if (!el) return;
  const list = filteredSalesList();
  const total = list.length;
  if (!total) { el.innerHTML = `<div class="empty"><span class="em-icon">🧾</span><b>No sales match</b>Try a different date, filter or search.</div>`; return; }
  const totalPages = Math.max(1, Math.ceil(total / State.salesPerPage));
  if (State.salesPage > totalPages) State.salesPage = totalPages;
  if (State.salesPage < 1) State.salesPage = 1;
  const start = (State.salesPage - 1) * State.salesPerPage;
  const pageItems = list.slice(start, start + State.salesPerPage);
  const grandTotal = list.reduce((a,s)=>a+(Number(s.total)||0),0);
  const rows = pageItems.map(s=>{
    const pm = s.paymentMethod || 'Cash';
    const typeBadge = s.type === 'scheduled_order' ? '<span class="badge badge-teal" style="font-size:10px">Order</span>' : '';
    const editedBadge = s.lastModifiedAt ? '<span class="badge badge-gold" style="font-size:9.5px">Edited</span>' : '';
    return `<tr class="${pm==='Pending'?'row-pending':''}">
      <td data-label="Date">${fmtDate(s.businessDate||s.date)}<br><small style="color:var(--muted)">${fmtTime(s.dateTime)}</small> ${editedBadge}</td>
      <td data-label="Customer">${typeBadge} ${esc(s.customerName||'Walk-in')}</td>
      <td data-label="Items">${(s.items||[]).map(i=>`${esc(i.productName)}${i.subcategoryName?' ('+esc(i.subcategoryName)+')':''} ×${i.qty}`).join('<br>')}</td>
      <td data-label="Payment">${paymentBadge(pm)}</td>
      <td data-label="Total" class="r mono"><b>${fmtINR(s.total)}</b></td>
      <td data-label="Actions">
        <div class="sale-actions">
          <button class="btn btn-ghost btn-sm" onclick="confirmEditSale('${s.id}')" title="Edit">✏️</button>
          <button class="btn btn-ghost btn-sm" onclick="printSaleA4('${s.id}')" title="Print / PDF">🖨️</button>
          <button class="btn btn-ghost btn-sm" onclick="viewSaleDetails('${s.id}')" title="View">👁️</button>
          <button class="btn btn-ghost btn-sm" onclick="confirmDeleteSale('${s.id}')" title="Delete" style="color:var(--red)">🗑️</button>
        </div>
      </td>
    </tr>`;
  }).join('');
  const perPageOptions = [10,20,30,40,50].map(n=>`<option value="${n}" ${n===State.salesPerPage?'selected':''}>${n} / page</option>`).join('');
  const pageBtns = buildPageButtons(State.salesPage, totalPages, 'salesGoToPage');
  el.innerHTML = `
    <div style="margin-bottom:14px;color:var(--brown);font-size:13px;display:flex;gap:14px;flex-wrap:wrap">
      <span><b>${total}</b> sale${total===1?'':'s'}</span>
      <span>Total: <b style="color:var(--orange)">${fmtINR(grandTotal)}</b></span>
      ${State.salesPayFilter!=='All'?`<span>Filter: <b>${esc(State.salesPayFilter)}</b></span>`:''}
    </div>
    <div class="tbl-wrap"><table class="data">
      <thead><tr><th>Date / Time</th><th>Customer</th><th>Items</th><th>Payment</th><th class="r">Total</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="pagination">
      <div class="pg-info">Showing <b>${start+1}–${Math.min(start+State.salesPerPage, total)}</b> of <b>${total}</b> records</div>
      <div class="pg-controls">
        <select class="pg-perpage" onchange="salesSetPerPage(this.value)">${perPageOptions}</select>
        <button class="pg-btn" onclick="salesGoToPage(${State.salesPage-1})" ${State.salesPage<=1?'disabled':''}>← Prev</button>
        ${pageBtns}
        <button class="pg-btn" onclick="salesGoToPage(${State.salesPage+1})" ${State.salesPage>=totalPages?'disabled':''}>Next →</button>
      </div>
    </div>`;
}
window.salesGoToPage = (p)=>{
  const total = filteredSalesList().length;
  const totalPages = Math.max(1, Math.ceil(total / State.salesPerPage));
  State.salesPage = Math.max(1, Math.min(totalPages, p));
  drawSalesTable();
};
window.salesSetPerPage = (v)=>{ State.salesPerPage = Number(v)||10; State.salesPage = 1; drawSalesTable(); };

window.editSaleQty = (idx, delta)=>{
  const s = State.editingSale; if (!s || !s.items[idx]) return;
  const line = s.items[idx];
  if (delta > 0) {
    const p = State.products[line.pid];
    const avail = p ? productStock(p) : line.qty;
    const origQty = findOriginalSaleQty(line.pid);
    const effectiveAvail = avail + origQty;
    if (line.qty + delta > effectiveAvail) { toast('Only ' + effectiveAvail + ' available for this sale', 'err'); return; }
  }
  line.qty = Math.max(0, line.qty + delta);
  if (line.qty === 0) s.items.splice(idx, 1);
  renderEditSaleModal();
};
window.editSaleRemoveLine = (idx)=>{ const s = State.editingSale; if(!s) return; s.items.splice(idx, 1); renderEditSaleModal(); };
window.editSalePrice = (idx, val)=>{
  const s = State.editingSale; if(!s) return;
  s.items[idx].price = Math.max(0, Number(val)||0);

};
window.editSaleDiscount = (val)=>{
  const s = State.editingSale; if (!s) return;
  const subtotal = s.items.reduce((a,i)=>a+i.price*i.qty,0);

window.editSaleAddLine = (pid)=>{
  const s = State.editingSale; if (!s) return;
  const p = State.products[pid]; if (!p) return;
  const existing = s.items.find(i=>i.pid===pid);
  const avail = productStock(p);
  if (existing) {
    if (existing.qty + 1 > avail + findOriginalSaleQty(pid)) { toast('Not enough stock', 'err'); return; }
    existing.qty += 1;
  } else {
    if (avail < 1) { toast('Out of stock','err'); return; }
    const cat = State.categories[p.categoryId] || {name:'Other'};
    const sub = p.subcategoryId ? subName(p.subcategoryId) : (isLegacyProduct(p)?'General':'');
    s.items.push({ pid, productName:p.name, categoryId:p.categoryId, categoryName:cat.name, subcategoryId:p.subcategoryId||'', subcategoryName:sub, price:productPrice(p), qty:1 });
  }
  renderEditSaleModal();
};
window.cancelEditSale = ()=>{ State.editingSale = null; State.editingSaleId = null; closeModal(); };

window.saveEditedSale = async ()=>{
  if (State.busy) return;
  const s = State.editingSale; if (!s) return;
  if (!s.items.length) { toast('Sale must have at least one item','err'); return; }
  const saleId = s.saleId;
  const original = State.sales[saleId];
  if (!original) { toast('Original sale not found','err'); return; }
  const subtotal = s.items.reduce((a,i)=>a+i.price*i.qty,0);
  const discount = Math.min(Math.max(0, Number(s.discount)||0), subtotal);
  const total = subtotal - discount;

  const origMap = {}; (original.items||[]).forEach(i=>{ origMap[i.pid] = (origMap[i.pid]||0)+i.qty; });
  const editMap = {}; s.items.forEach(i=>{ editMap[i.pid] = (editMap[i.pid]||0)+i.qty; });
  const allPids = new Set([...Object.keys(origMap), ...Object.keys(editMap)]);
  const deltas = [];
  for (const pid of allPids) {
    const oq = origMap[pid]||0;
    const eq = editMap[pid]||0;
    const d = eq - oq;
    if (d !== 0) deltas.push({ pid, delta: d });
  }
  for (const d of deltas) {
    if (d.delta > 0) {
      const p = State.products[d.pid];
      const avail = p ? productStock(p) : 0;
      if (avail < d.delta) { toast(`Insufficient stock for ${p?.name||d.pid} (need ${d.delta} more)`, 'err'); return; }
    }
  }

  const beforeSnapshot = {
    itemsSummary: summarizeItems(original.items),
    subtotal: original.subtotal, discount: original.discount, total: original.total,
    paymentMethod: original.paymentMethod, note: original.note,
    customerName: original.customerName
  };
  const afterSnapshot = {
    itemsSummary: summarizeItems(s.items),
    subtotal, discount, total,
    paymentMethod: s.paymentMethod,
    note: s.note || '',
    customerName: s.customerName || 'Walk-in'
  };

  State.busy = true; showLoading(true);
  const applied = [];
  try {
    for (const d of deltas) {
      const p = State.products[d.pid];
      const from = p ? productStock(p) : 0;
      const res = await adjustProductStock(d.pid, -d.delta, {
        productName: p?.name || d.pid, from,
        reason: 'Edit sale ' + saleId, refId: saleId
      });
      if (!res.ok) throw new Error('Stock update failed for ' + (p?.name || d.pid));
      applied.push({ pid: d.pid, delta: d.delta });
    }

    await update(ref(db,'sales/'+saleId), {
      items: s.items.map(i=>({ pid:i.pid, productName:i.productName, categoryId:i.categoryId, categoryName:i.categoryName, subcategoryId:i.subcategoryId||'', subcategoryName:i.subcategoryName||'', price:i.price, qty:i.qty })),
      subtotal, discount, total,
      paymentMethod: s.paymentMethod,
      payments: { [s.paymentMethod]: total },
      note: s.note || '',
      customerName: s.customerName || 'Walk-in',
      lastModifiedAt: nowISO(),
      lastModifiedBy: State.user.uid,
      lastModifiedByName: State.profile?.name || '',
    });

    if (original.customerId) {
      const c = State.customers[original.customerId] || {};
      const deltaTotal = total - (Number(original.total)||0);
      if (deltaTotal !== 0) {
        await update(ref(db,'customers/'+original.customerId), {
          totalPurchases: Math.max(0, (Number(c.totalPurchases)||0) + deltaTotal)
        });
      }
    }

    await recordActivity({
      type:'sale_edited',
      description:'Edited sale '+saleId.slice(-8)+' · '+fmtINR(total),
      recordId: saleId,
      diff: buildDiff(beforeSnapshot, afterSnapshot),
      details: { stockDeltas: deltas }
    });

    toast('Sale updated');
    State.editingSale = null; State.editingSaleId = null;
    closeModal();
  } catch (err) {
    for (const a of applied) {
      try { await adjustProductStock(a.pid, a.delta, { reason:'Rollback edit', refId:'rollback-edit-'+saleId }); } catch(_){}
    }
    toast('Failed: ' + (err.message || err.code || 'unknown'),'err');
  } finally { State.busy = false; showLoading(false); }
};

window.deleteSaleConfirmed = async (id)=>{
  if (State.busy) return;
  const s = State.sales[id]; if (!s) return;
  State.busy = true; showLoading(true);
  const restored = [];
  try {
    for (const it of (s.items||[])) {
      const p = State.products[it.pid];
      const from = p ? productStock(p) : 0;
      const res = await adjustProductStock(it.pid, it.qty, {
        productName: it.productName, from,
        reason: 'Sale deleted ' + id, refId: id
      });
      if (!res.ok) throw new Error('Stock restore failed for ' + it.productName);
      restored.push({ pid: it.pid, qty: it.qty });
    }
    await remove(ref(db,'sales/'+id));
    if (s.customerId) {
      const c = State.customers[s.customerId] || {};
      await update(ref(db,'customers/'+s.customerId), {
        totalPurchases: Math.max(0, (Number(c.totalPurchases)||0) - (Number(s.total)||0))
      });
    }
    await recordActivity({
      type:'sale_deleted',
      description:'Deleted sale '+id.slice(-8)+' · '+fmtINR(s.total),
      recordId: id,
      diff: buildDiff({
        itemsSummary: summarizeItems(s.items),
        subtotal: s.subtotal, discount: s.discount, total: s.total,
        paymentMethod: s.paymentMethod,
        customerName: s.customerName, note: s.note
      }, {}),
      details: { restoredItems: restored }
    });
    toast('Sale deleted · stock restored');
  } catch (err) {
    for (const r of restored) {
      try { await adjustProductStock(r.pid, -r.qty, { reason:'Rollback delete', refId:'rollback-del-'+id }); } catch(_){}
    }
    toast('Failed: ' + (err.message || err.code || 'unknown'),'err');
  } finally { State.busy = false; showLoading(false); }
};

function renderProducts(){
  const el = $('#pageContent');
  el.innerHTML = `
    <div class="filter-bar">
      <input id="prodSearch" class="input" placeholder="🔍 Search products / subcategories">
      <button class="btn btn-secondary btn-sm" onclick="openCategoryManager()">📁 Categories</button>
      <button class="btn btn-primary btn-sm" onclick="openAddProduct()">➕ Add Product</button>
    </div>
    <div id="prodTree"></div>`;
  $('#prodSearch').oninput = drawProductTree;
  drawProductTree();
}
function drawProductTree(){
  const q = ($('#prodSearch')?.value||'').toLowerCase();
  const cats = Object.entries(State.categories).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  const tree = $('#prodTree');
  if(!cats.length){
    tree.innerHTML = `<div class="card"><div class="empty"><span class="em-icon">🍰</span><b>No categories yet</b>Start by adding a category, then subcategories, then products.</div>
      <div style="text-align:center;margin-top:-12px;margin-bottom:16px"><button class="btn btn-primary" onclick="openCategoryManager()">➕ Add Category</button></div></div>`;
    return;
  }
  let html = '';
  cats.forEach(([catId,cat])=>{
    const subs = subsForCat(catId);
    const legacy = Object.entries(State.products).filter(([id,p])=>p.categoryId===catId && isLegacyProduct(p));
    const subCount = subs.length + (legacy.length?1:0);
    let catMatch = !q || (cat.name||'').toLowerCase().includes(q);
    const filteredSubs = subs.filter(([sid,s])=>{
      if(!q) return true;
      if((s.name||'').toLowerCase().includes(q)) return true;
      return productsFor(catId, sid).some(([pid,p])=>(p.name||'').toLowerCase().includes(q));
    });
    const filteredLegacy = legacy.filter(([id,p])=>!q || (p.name||'').toLowerCase().includes(q));
    if(q && !catMatch && !filteredSubs.length && !filteredLegacy.length) return;
    html += `<div class="admin-tree-cat">
      <div class="cat-head">
        <span style="font-size:20px">📁</span>
        <div class="cat-name">${esc(cat.name)} <span class="badge badge-orange" style="margin-left:6px;font-family:var(--f-body);font-size:10.5px">${subCount} sub${subCount===1?'':'s'}</span></div>
        <button class="btn btn-ghost btn-sm" onclick="openAddSubcategory('${catId}')">➕ Subcategory</button>
        <button class="btn btn-ghost btn-sm" onclick="openAddProduct('${catId}')">➕ Product</button>
        <button class="icon-btn" onclick="editCategory('${catId}')" title="Rename">✏️</button>
        <button class="icon-btn danger" onclick="deleteCategory('${catId}')" title="Delete">🗑️</button>
      </div>
      <div class="cat-body">`;
    if(!filteredSubs.length && !filteredLegacy.length){
      html += `<div class="empty" style="padding:24px 12px"><span class="em-icon">📂</span><b>No subcategories</b>Add a subcategory.</div>`;
    }
    filteredSubs.forEach(([sid,sub])=>{
      const prods = productsFor(catId, sid).filter(([pid,p])=>!q || (p.name||'').toLowerCase().includes(q) || (sub.name||'').toLowerCase().includes(q));
      html += renderSubBlock(catId, sid, sub, prods);
    });
    if(filteredLegacy.length){
      html += `<div class="admin-sub">
        <div class="sub-head"><span style="font-size:16px">📂</span><div class="sub-name">General (Legacy)</div></div>
        <div class="sub-products">${filteredLegacy.map(([pid,p])=>renderProductRow(pid,p)).join('')}</div>
      </div>`;
    }
    html += `</div></div>`;
  });
  tree.innerHTML = html;
}
function renderSubBlock(catId, sid, sub, prods){
  return `<div class="admin-sub">
    <div class="sub-head">
      <span style="font-size:16px">📂</span>
      <div class="sub-name">${esc(sub.name)} <span class="badge badge-violet" style="font-family:var(--f-body);font-size:10.5px;margin-left:4px">${prods.length}</span></div>
      <button class="btn btn-ghost btn-sm" onclick="openAddProduct('${catId}','${sid}')">➕ Product</button>
      <button class="icon-btn" onclick="editSubcategory('${sid}')" title="Rename">✏️</button>
      <button class="icon-btn danger" onclick="deleteSubcategory('${sid}')" title="Delete">🗑️</button>
    </div>
    <div class="sub-products">${prods.length ? prods.map(([pid,p])=>renderProductRow(pid,p)).join('') : '<div class="empty" style="padding:16px"><span class="em-icon">🍦</span>No products yet.</div>'}</div>
  </div>`;
}
function renderProductRow(pid, p){
  const price = productPrice(p);
  const stock = productStock(p);
  const low = stock <= (p.minStock||0);
  return `<div class="admin-prod-row">
    <div class="apr-img"><img src="${esc(imgOrPlaceholder(p.image))}" alt="" onerror="window.__imgFail(this)"></div>
    <div class="apr-info">
      <div class="apr-name">${esc(p.name)}</div>
      <div class="apr-meta">Stock: <b style="${low?'color:var(--red)':''}">${stock}</b> · ${p.active===false?'<span style="color:var(--red)">Inactive</span>':'Active'}</div>
    </div>
    <div class="apr-price">${fmtINR(price)}</div>
    <div class="apr-actions">
      <button class="icon-btn" onclick="openEditProduct('${pid}')" title="Edit">✏️</button>
      <button class="icon-btn danger" onclick="deleteProduct('${pid}')" title="Delete">🗑️</button>
    </div>
  </div>`;
}

function bindProductForm(presetCat, presetSub){
  const catSel = $('#pfCat'), subSel = $('#pfSub');
  const fillSubs = ()=>{
    const cat = catSel.value;
    const subs = subsForCat(cat);
    subSel.innerHTML = subs.length ? subs.map(([sid,s])=>`<option value="${sid}">${esc(s.name)}</option>`).join('') : '<option value="">— No subcategories —</option>';
    if(presetSub && subs.some(([sid])=>sid===presetSub)) subSel.value = presetSub;
  };
  catSel.onchange = fillSubs;
  fillSubs();
  if(presetCat && catSel.querySelector(`option[value="${presetCat}"]`)) catSel.value = presetCat;
  fillSubs();
  if(presetSub) subSel.value = presetSub;
}
window.updateImgPreview = ()=>{
  const url = $('#pfImage')?.value.trim() || '';

    subcategoryName: p.subcategoryId ? subName(p.subcategoryId) : ''
  };

      variants: null, prices: null,

      name, price, stock, minStock, active, image, categoryName: catName, subcategoryName: subNameStr
    };
    await recordActivity({
      type:'product_edited',
      description:`Updated "${name}" in ${catName} → ${subNameStr}`,
      recordId:pid,
      diff: buildDiff(beforeSnapshot, afterSnapshot)
    });

window.deleteProduct = (id)=>{

};

   ============================================================ */
function renderInventory(){
  const el = $('#pageContent');
  const total = Object.keys(State.products).length;
  const lowList = Object.values(State.products).filter(p=>productStock(p) <= (p.minStock||0));
  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="sc-label">Total Products</div><div class="sc-value">${total}</div></div>
      <div class="stat-card red"><div class="sc-label">Low / Zero Stock</div><div class="sc-value">${lowList.length}</div></div>
    </div>
    <div class="filter-bar">
      <input id="invSearch" class="input" placeholder="🔍 Search product">
      <button class="btn btn-ghost btn-sm" onclick="expandAllInventory(true)">Expand All</button>
      <button class="btn btn-ghost btn-sm" onclick="expandAllInventory(false)">Collapse All</button>
    </div>
    <div id="invTree"></div>`;
  $('#invSearch').oninput = drawInventoryTree;
  drawInventoryTree();
}
window.expandAllInventory = (expand)=>{
  Object.keys(State.categories).forEach(cid => {
    if (expand) State.invExpandedCats.add(cid); else State.invExpandedCats.delete(cid);
    Object.entries(State.subcategories).filter(([sid,s])=>s.categoryId===cid).forEach(([sid])=>{
      if (expand) State.invExpandedSubs.add(sid); else State.invExpandedSubs.delete(sid);
    });
  });
  drawInventoryTree();
};
window.toggleInvCat = (cid)=>{
  if (State.invExpandedCats.has(cid)) State.invExpandedCats.delete(cid);
  else State.invExpandedCats.add(cid);
  drawInventoryTree();
};
window.toggleInvSub = (sid)=>{
  if (State.invExpandedSubs.has(sid)) State.invExpandedSubs.delete(sid);
  else State.invExpandedSubs.add(sid);
  drawInventoryTree();
};
function drawInventoryTree(){
  const q = ($('#invSearch')?.value||'').toLowerCase();
  const cats = Object.entries(State.categories).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  const tree = $('#invTree');
  if (!cats.length) {
    tree.innerHTML = `<div class="card"><div class="empty"><span class="em-icon">📦</span><b>No categories yet</b>Create categories, subcategories, and products in the Products section first.</div>
      <div style="text-align:center;margin-top:-12px;margin-bottom:16px"><button class="btn btn-primary" onclick="navigateTo('products')">Go to Products →</button></div></div>`;
    return;
  }
  let html = '';
  cats.forEach(([catId,cat])=>{
    const subs = subsForCat(catId);
    const prodsInCat = Object.entries(State.products).filter(([id,p])=>p.categoryId===catId);
    const legacy = prodsInCat.filter(([id,p])=>isLegacyProduct(p));
    const totalInCat = prodsInCat.length;
    const lowInCat = prodsInCat.filter(([id,p])=> productStock(p) <= (p.minStock||0)).length;
    const filteredSubs = subs.filter(([sid,s])=>{
      if (!q) return true;
      if ((s.name||'').toLowerCase().includes(q)) return true;
      return productsFor(catId, sid).some(([pid,p])=>(p.name||'').toLowerCase().includes(q));
    });
    const filteredLegacy = legacy.filter(([id,p])=>!q || (p.name||'').toLowerCase().includes(q));
    if (q && !filteredSubs.length && !filteredLegacy.length) return;
    const isExpanded = q ? true : State.invExpandedCats.has(catId);
    html += `<div class="inv-tree-cat">
      <div class="cat-head" onclick="toggleInvCat('${catId}')">
        <span style="font-size:18px;transition:.2s;transform:rotate(${isExpanded?90:0}deg)">▶</span>
        <div class="cat-name">📁 ${esc(cat.name)}</div>
        <div class="cat-sum">${totalInCat} product${totalInCat===1?'':'s'}${lowInCat?` · <span style="color:var(--red)">${lowInCat} low</span>`:''}</div>
      </div>
      ${isExpanded ? `<div class="cat-body">` : ''}`;
    if (isExpanded) {
      if (!filteredSubs.length && !filteredLegacy.length) {
        html += `<div class="empty" style="padding:20px 12px"><span class="em-icon">📂</span><b>No subcategories</b>Add subcategories in Products.</div>`;
      }
      filteredSubs.forEach(([sid,sub])=>{
        const prods = productsFor(catId, sid).filter(([pid,p])=>!q || (p.name||'').toLowerCase().includes(q) || (sub.name||'').toLowerCase().includes(q));
        const isSubExpanded = q ? true : State.invExpandedSubs.has(sid);
        const lowInSub = prods.filter(([pid,p])=>productStock(p) <= (p.minStock||0)).length;
        html += `<div class="inv-sub">
          <div class="sub-head" onclick="toggleInvSub('${sid}')">
            <span style="font-size:14px;transition:.2s;transform:rotate(${isSubExpanded?90:0}deg)">▶</span>
            <div class="sub-name">📂 ${esc(sub.name)} <span class="badge badge-violet" style="font-family:var(--f-body);font-size:10px;margin-left:4px">${prods.length}</span>${lowInSub?` <span class="badge badge-red" style="font-family:var(--f-body);font-size:10px">${lowInSub} low</span>`:''}</div>
          </div>
          ${isSubExpanded ? `<div class="sub-products">${prods.length ? prods.map(([pid,p])=>renderInvProductRow(pid,p)).join('') : '<div class="empty" style="padding:14px"><span class="em-icon">🍦</span>No products yet.</div>'}</div>` : ''}
        </div>`;
      });
      if (filteredLegacy.length) {
        const sid = '__legacy__';
        const isSubExpanded = q ? true : State.invExpandedSubs.has(sid);
        html += `<div class="inv-sub">
          <div class="sub-head" onclick="toggleInvSub('${sid}')">
            <span style="font-size:14px;transition:.2s;transform:rotate(${isSubExpanded?90:0}deg)">▶</span>
            <div class="sub-name">📂 General (Legacy) <span class="badge badge-violet" style="font-family:var(--f-body);font-size:10px;margin-left:4px">${filteredLegacy.length}</span></div>
          </div>
          ${isSubExpanded ? `<div class="sub-products">${filteredLegacy.map(([pid,p])=>renderInvProductRow(pid,p)).join('')}</div>` : ''}
        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  });
  tree.innerHTML = html;
}
function renderInvProductRow(pid, p){
  const stock = productStock(p);
  const min = Number(p.minStock)||0;
  const low = stock <= min;
  return `<div class="inv-prod-row ${low?'low':''}">
    <div class="ipr-img"><img src="${esc(imgOrPlaceholder(p.image))}" alt="" onerror="window.__imgFail(this)"></div>
    <div class="ipr-info">
      <div class="ipr-name">${esc(p.name)}</div>
      <div class="ipr-meta">Min: ${min} · ${fmtINR(productPrice(p))} ${low?'<span style="color:var(--red)">· Low</span>':''}</div>
    </div>
    <div class="ipr-stock"><input class="${low?'low':''}" type="number" min="0" step="1" value="${stock}" onchange="updateStockFromInput('${pid}', this)" onclick="event.stopPropagation()"></div>
    <div class="ipr-actions">
      <button class="icon-btn" title="Add Stock" onclick="event.stopPropagation();quickAdjustStock('${pid}', 1)">➕</button>
      <button class="icon-btn" title="Remove Stock" onclick="event.stopPropagation();quickAdjustStock('${pid}', -1)">➖</button>
      <button class="icon-btn" title="Adjust" onclick="event.stopPropagation();openStockAdjust('${pid}')">⚙️</button>
    </div>
  </div>`;
}
window.updateStockFromInput = async (pid, inputEl)=>{
  const p = State.products[pid]; if(!p) return;
  const oldVal = productStock(p);
  const newVal = Math.max(0, Math.floor(Number(inputEl.value)||0));
  if (newVal === oldVal) return;
  inputEl.disabled = true;
  try {
    const res = await setProductStock(pid, newVal, { productName: p.name, from: oldVal, reason: 'Manual set' });
    if (!res.ok) { toast('Update failed','err'); inputEl.value = oldVal; }
    else {
      const catName = State.categories[p.categoryId]?.name || '';
      const subNm = p.subcategoryId ? subName(p.subcategoryId) : '';
      await recordActivity({
        type:'inventory_updated',
        description:`Set stock for "${p.name}"${subNm?' ('+catName+' → '+subNm+')':''}: ${oldVal} → ${res.value}`,
        recordId:pid,
        diff: buildDiff({ stock: oldVal }, { stock: res.value })
      });
      toast(`Stock updated: ${p.name} → ${res.value}`);
    }
  } catch(e){ toast('Error: ' + (e.message||e.code||'unknown'),'err'); inputEl.value = oldVal; }
  finally { inputEl.disabled = false; const low = newVal <= (p.minStock||0); inputEl.classList.toggle('low', low); }
};
window.quickAdjustStock = async (pid, delta)=>{
  const p = State.products[pid]; if(!p) return;
  const from = productStock(p);
  if (delta < 0 && from + delta < 0) { toast('Cannot reduce below 0', 'err'); return; }
  try {
    const res = await adjustProductStock(pid, delta, { productName: p.name, from, reason: delta>0?'Quick add':'Quick remove' });
    if (res.ok) {
      const catName = State.categories[p.categoryId]?.name || '';
      const subNm = p.subcategoryId ? subName(p.subcategoryId) : '';
      await recordActivity({
        type: delta>0?'inventory_increased':'inventory_decreased',
        description:`${delta>0?'Added':'Removed'} ${Math.abs(delta)} for "${p.name}"${subNm?' ('+catName+' → '+subNm+')':''}: ${from} → ${res.value}`,
        recordId: pid,
        diff: buildDiff({ stock: from }, { stock: res.value })
      });
      toast(`${p.name}: ${from} → ${res.value}`);
    }
  } catch(e){ toast('Error: ' + (e.message||e.code||'unknown'),'err'); }
};
window.openStockAdjust = (pid)=>{
  const p = State.products[pid]; if(!p) return;
  const stock = productStock(p);
  const recent = Object.entries(State.stockMovements||{}).map(([id,m])=>({id,...m})).filter(m=>m.productId===pid).sort((a,b)=> new Date(b.at||0) - new Date(a.at||0)).slice(0, 10);
  openModal('Stock: ' + p.name, `
    <div style="margin-bottom:14px;padding:12px 14px;background:var(--cream-2);border-radius:var(--r-sm);border:1px solid var(--line-2)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:700;color:var(--brown);font-size:12.5px">Current Stock</span>
        <span class="mono" style="font-family:var(--f-display);font-size:24px;font-weight:800;color:${stock <= (p.minStock||0)?'var(--red)':'var(--dark)'}">${stock}</span>
      </div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:4px">Min alert: ${p.minStock||0}</div>
    </div>
    <label class="field"><span>Operation</span><select id="adjOp" class="input"><option value="add">➕ Add Stock</option><option value="remove">➖ Remove Stock</option><option value="set">🔢 Set Exact</option></select></label>
    <label class="field"><span>Quantity</span><input id="adjQty" type="number" min="0" class="input" value="1"></label>
    <label class="field" style="margin-bottom:10px"><span>Reason</span><input id="adjReason" class="input" placeholder="Restock / Damage / Correction"></label>
    ${recent.length ? `
      <div style="margin-top:16px">
        <div style="font-weight:800;color:var(--brown);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Recent Movements</div>
        <div style="max-height:180px;overflow-y:auto;border:1px solid var(--line-2);border-radius:var(--r-sm)">
          ${recent.map(m=>`<div style="padding:8px 10px;border-bottom:1px solid var(--line-2);font-size:12px;display:flex;justify-content:space-between;gap:10px">
            <div style="min-width:0;flex:1">
              <div style="font-weight:700;color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.reason||'—')}</div>
              <div style="color:var(--muted);font-size:11px">${fmtTime(m.at)} · ${esc(m.byName||'')}</div>
            </div>
            <div style="font-weight:800;color:${(Number(m.delta)||0)>=0?'var(--green)':'var(--red)'};font-variant-numeric:tabular-nums">${(Number(m.delta)||0)>=0?'+':''}${Number(m.delta)||0}</div>
          </div>`).join('')}
        </div>
      </div>`:''}
  `, `<button class="btn btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn btn-primary" id="adjSave">Apply</button>`);
  $('#adjSave').onclick = async ()=>{
    const op = $('#adjOp').value;
    const q = Math.max(0, Math.floor(Number($('#adjQty').value)||0));
    const reason = $('#adjReason').value.trim() || (op==='add'?'Restock':op==='remove'?'Removal':'Set exact');
    const from = productStock(p);
    try {
      let res;
      if (op === 'set') res = await setProductStock(pid, q, { productName: p.name, from, reason });
      else if (op === 'add') res = await adjustProductStock(pid, q, { productName: p.name, from, reason });
      else res = await adjustProductStock(pid, -q, { productName: p.name, from, reason });
      if (res.ok) {
        const catName = State.categories[p.categoryId]?.name || '';
        const subNm = p.subcategoryId ? subName(p.subcategoryId) : '';
        await recordActivity({
          type:'inventory_adjusted',
          description:`Adjusted stock for "${p.name}"${subNm?' ('+catName+' → '+subNm+')':''} (${op} ${q}, ${reason}): ${from} → ${res.value}`,
          recordId: pid,
          diff: buildDiff({ stock: from }, { stock: res.value })
        });
        toast(`${p.name}: ${from} → ${res.value}`);
        closeModal();
      } else toast('Update failed','err');
    } catch(e){ toast('Error: ' + (e.message||e.code||'unknown'),'err'); }
  };
};

    <label class="field"><span>Category</span><select id="expCat" class="input">${cats.map(c=>`<option ${c===e.category?'selected':''}>${c}</option>`).join('')}</select></label>
    <label class="field"><span>Description</span><input id="expDesc" class="input" value="${esc(e.description||'')}"></label>
    <label class="field"><span>Amount (₹)</span><input id="expAmt" type="number" class="input" value="${Number(e.amount)||0}"></label>
    <label class="field"><span>Payment Method</span><select id="expPay" class="input">${['Cash','UPI','Card','Other'].map(p=>`<option ${p===(e.paymentMethod||'Cash')?'selected':''}>${p}</option>`).join('')}</select></label>
    <label class="field" style="margin-bottom:0"><span>Notes</span><textarea id="expNotes" class="input" rows="2">${esc(e.notes||'')}</textarea></label>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="saveExpBtn">Update</button>`);
  $('#saveExpBtn').onclick = async ()=>{
    const amt = Number($('#expAmt').value)||0;
    if(amt<=0){ toast('Enter amount','err'); return; }

      date: $('#expDate').value, category:$('#expCat').value, description:$('#expDesc').value.trim(),
      amount:amt, paymentMethod:$('#expPay').value, notes:$('#expNotes').value.trim(),

    };
    await update(ref(db,'expenses/'+id), data);

    });

};

};

  catch(e){ toast('Copy failed','err'); }
};

function renderReports(){
  if(!isAdmin()){ toast('Access denied','err'); navigateTo('dashboard'); return; }
  const el = $('#pageContent');
  const bd = activeBusinessDate();
  if (!State.repFromDate) State.repFromDate = bd;
  if (!State.repToDate) State.repToDate = bd;
  el.innerHTML = `
    <div class="filter-bar">
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--brown)">
        From: <input id="repFrom" type="date" class="input" style="max-width:180px" value="${esc(State.repFromDate)}">
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--brown)">
        To: <input id="repTo" type="date" class="input" style="max-width:180px" value="${esc(State.repToDate)}">
      </label>
      <button class="btn btn-ghost btn-sm" onclick="exportCSV('sales')">⬇️ Sales CSV</button>
      <button class="btn btn-ghost btn-sm" onclick="exportCSV('expenses')">⬇️ Expenses CSV</button>
      <button class="btn btn-ghost btn-sm" onclick="window.print()">🖨️ Print</button>
    </div>
    <div id="reportBody"></div>`;
  $('#repFrom').onchange = (e)=>{ State.repFromDate = e.target.value; drawReports(); };
  $('#repTo').onchange = (e)=>{ State.repToDate = e.target.value; drawReports(); };
  drawReports();
}
function drawReports(){
  const el = document.getElementById('reportBody'); if (!el) return;
  const fromDate = State.repFromDate || activeBusinessDate();
  const toDate = State.repToDate || activeBusinessDate();
  if (toDate < fromDate) {
    el.innerHTML = `<div class="card" style="border-left:4px solid var(--red)"><b style="color:var(--red)">Invalid range:</b> To Date cannot be earlier than From Date.</div>`;
    return;
  }
  const all = Object.entries(State.sales).map(([id,s])=>({id,...s})).filter(s=>{
    if (s.cancelled) return false;
    const bd = s.businessDate || s.date;
    return bd >= fromDate && bd <= toDate;
  });
  const total = all.reduce((a,s)=>a+(Number(s.total)||0), 0);
  const orders = all.length;
  const items = all.reduce((a,s)=>a+(s.items||[]).reduce((b,it)=>b+(Number(it.qty)||0),0), 0);
  const byPay = { Cash:0, UPI:0, Card:0, Pending:0 };
  all.forEach(s=>{ const pm = s.paymentMethod||'Cash'; byPay[pm] = (byPay[pm]||0)+(Number(s.total)||0); });
  const byCat = {};
  all.forEach(s=>{ (s.items||[]).forEach(it=>{
    const cat = it.categoryName || 'Other';
    byCat[cat] = (byCat[cat]||0) + (Number(it.price)||0)*(Number(it.qty)||0);
  }); });
  const exp = Object.values(State.expenses).filter(e=>{
    if (!e.date) return false;
    return e.date >= fromDate && e.date <= toDate;
  });
  const expTotal = exp.reduce((a,e)=>a+(Number(e.amount)||0),0);
  const prodSales = {};
  all.forEach(s=>s.items?.forEach(it=>{
    const k = it.productName + (it.subcategoryName?' ('+it.subcategoryName+')':'');
    if(!prodSales[k]) prodSales[k] = { qty:0, rev:0 };
    prodSales[k].qty += it.qty; prodSales[k].rev += it.price * it.qty;
  }));
  const topProducts = Object.entries(prodSales).sort((a,b)=>b[1].rev-a[1].rev).slice(0,10);
  el.innerHTML = `
    <div style="margin-bottom:14px;font-size:12.5px;color:var(--muted)">Reporting period: <b style="color:var(--dark)">${fmtDate(fromDate)} — ${fmtDate(toDate)}</b> (business dates)</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="sc-label">Total Sales</div><div class="sc-value mono">${fmtINR(total)}</div></div>
      <div class="stat-card teal"><div class="sc-label">Orders</div><div class="sc-value">${orders}</div></div>
      <div class="stat-card violet"><div class="sc-label">Items Sold</div><div class="sc-value">${items}</div></div>
      <div class="stat-card pink"><div class="sc-label">Avg Order</div><div class="sc-value mono">${fmtINR(orders?total/orders:0)}</div></div>
      <div class="stat-card red"><div class="sc-label">Expenses</div><div class="sc-value mono">${fmtINR(expTotal)}</div></div>
      <div class="stat-card green"><div class="sc-label">Net After Expenses</div><div class="sc-value mono">${fmtINR(total-expTotal)}</div></div>
    </div>
    <div class="chart-grid">
      <div class="card"><div class="card-title"><span class="chip">📊</span>Category Revenue</div><div class="chart-wrap"><canvas id="repCatChart"></canvas></div></div>
      <div class="card"><div class="card-title"><span class="chip">💳</span>Payment Split</div><div class="chart-wrap"><canvas id="repPayChart"></canvas></div></div>
    </div>
    <div class="card"><div class="card-title"><span class="chip">🏆</span>Top Products</div>
      <div class="tbl-wrap"><table class="data"><thead><tr><th>Product</th><th class="r">Qty</th><th class="r">Revenue</th></tr></thead>
      <tbody>${topProducts.map(([k,v])=>`<tr><td data-label="Product">${esc(k)}</td><td data-label="Qty" class="r mono">${v.qty}</td><td data-label="Revenue" class="r mono"><b>${fmtINR(v.rev)}</b></td></tr>`).join('') || '<tr><td colspan="3" class="empty">No sales in period.</td></tr>'}</tbody>
      </table></div>
    </div>`;
  if(State.chartInstances.repCat) State.chartInstances.repCat.destroy();
  const catCtx = document.getElementById('repCatChart'); if(catCtx){
    const entries = Object.entries(byCat).filter(([k,v])=>v>0);
    if(entries.length){
      const palette = ['#FF982F','#F25F8B','#0FA8A0','#7C6CD9','#E3B23C','#93602F'];
      State.chartInstances.repCat = new Chart(catCtx, { type:'bar',
        data:{ labels:entries.map(e=>e[0]), datasets:[{ label:'Revenue', data:entries.map(e=>e[1]), backgroundColor:palette, borderRadius:8, borderSkipped:false }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
          scales:{ y:{beginAtZero:true,ticks:{callback:v=>'₹'+v,color:'#8C7862'},grid:{color:'#F6ECDC'}}, x:{ticks:{color:'#8C7862'},grid:{display:false}} } }
      });
    } else catCtx.parentElement.innerHTML='<div class="empty">No category data.</div>';
  }
  if(State.chartInstances.repPay) State.chartInstances.repPay.destroy();
  const payCtx = document.getElementById('repPayChart'); if(payCtx){
    const entries = Object.entries(byPay).filter(([k,v])=>v>0);
    if(entries.length){
      State.chartInstances.repPay = new Chart(payCtx, { type:'doughnut',
        data:{ labels:entries.map(e=>e[0]), datasets:[{ data:entries.map(e=>e[1]), backgroundColor:['#FF982F','#F25F8B','#0FA8A0','#7C6CD9'], borderWidth:3, borderColor:'#fff' }] },
        options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{legend:{position:'bottom',labels:{boxWidth:10,boxHeight:10,color:'#8C7862',font:{size:11,weight:'600'}}}} }
      });
    } else payCtx.parentElement.innerHTML='<div class="empty">No payment data.</div>';
  }
}

  const count = Object.keys(State.activities||{}).length;
  el.innerHTML = `
    <div class="filter-bar">

      <select id="actTypeFilter" class="input">
        <option value="All">All Types</option>
        ${Object.entries(ACT_TYPE_META).map(([k,v])=>`<option value="${k}" ${k===State.activityTypeFilter?'selected':''}>${v.icon} ${v.label}</option>`).join('')}
      </select>
      <select id="actUserFilter" class="input"><option value="All">All Users</option></select>
      <input id="actDateFilter" type="date" class="input" value="${esc(State.activityDateFilter||'')}">
