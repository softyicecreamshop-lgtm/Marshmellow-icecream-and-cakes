<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
<meta name="theme-color" content="#FF982F" />
<title>Marshmallow · Management Portal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --orange:#FF982F; --orange-2:#FFAB45; --orange-3:#FFC97A;
  --brown:#93602F; --brown-2:#B98055; --dark:#49301F; --dark-2:#2D1D11;
  --cream:#FFF4E5; --cream-2:#FFF9F1; --bg:#FFFBF5;
  --teal:#0FA8A0; --teal-soft:#E4F7F5;
  --pink:#F25F8B; --pink-soft:#FDE8EE;
  --gold:#E3B23C; --gold-soft:#FBF1D6;
  --violet:#7C6CD9; --violet-soft:#EEEAFC;
  --green:#2FA84F; --green-soft:#E7F7EC;
  --red:#E5484D; --red-soft:#FDECEC;
  --muted:#8C7862; --line:#F0E4D2; --line-2:#F6ECDC;
  --shadow-sm:0 2px 8px rgba(73,48,31,.05);
  --shadow:0 6px 24px rgba(73,48,31,.07);
  --shadow-lg:0 16px 48px rgba(73,48,31,.14);
  --shadow-orange:0 8px 24px rgba(255,152,47,.28);
  --r-xs:8px; --r-sm:12px; --r:16px; --r-lg:22px; --r-xl:28px;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --f-display:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--f-body);background:var(--bg);color:var(--dark);font-size:15px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--orange);text-decoration:none}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#EADBC5;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:var(--r-sm);font-weight:700;font-size:14px;transition:all .2s cubic-bezier(.4,0,.2,1);min-height:46px;white-space:nowrap;letter-spacing:.1px;position:relative;overflow:hidden;}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--orange) 0%,var(--orange-2) 55%,var(--orange-3) 100%);color:#fff;box-shadow:var(--shadow-orange)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 28px rgba(255,152,47,.42)}
.btn-teal{background:linear-gradient(135deg,var(--teal),#13C0B7);color:#fff;box-shadow:0 8px 24px rgba(15,168,160,.28)}
.btn-violet{background:linear-gradient(135deg,var(--violet),#9A8DE8);color:#fff;box-shadow:0 8px 24px rgba(124,108,217,.28)}
.btn-pink{background:linear-gradient(135deg,var(--pink),#F98AB0);color:#fff;box-shadow:0 8px 24px rgba(242,95,139,.28)}
.btn-secondary{background:var(--cream);color:var(--brown)}
.btn-secondary:hover{background:#FFE8C9}
.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:#fff;color:var(--brown);border:1.5px solid var(--line)}
.btn-ghost:hover{background:var(--cream-2);border-color:var(--orange-3);color:var(--dark)}
.btn-sm{padding:8px 14px;min-height:38px;font-size:13px;border-radius:10px}
.btn-block{width:100%}

.card{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px;border:1px solid var(--line-2)}
.card-title{font-family:var(--f-display);font-size:16px;font-weight:700;color:var(--dark);margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-title .chip{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;background:var(--cream);font-size:16px;flex-shrink:0}

.input,select.input,textarea.input{width:100%;padding:12px 15px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;transition:all .2s;min-height:46px;font-weight:500;color:var(--dark);}
.input::placeholder{color:#B9A692}
.input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,152,47,.14)}
label.field{display:block;margin-bottom:14px}
label.field>span{display:block;font-size:12.5px;font-weight:700;color:var(--brown);margin-bottom:6px;letter-spacing:.2px}

.badge{display:inline-flex;align-items:center;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;letter-spacing:.2px;gap:4px}
.badge-orange{background:var(--cream);color:var(--brown)}
.badge-green{background:var(--green-soft);color:var(--green)}
.badge-red{background:var(--red-soft);color:var(--red)}
.badge-teal{background:var(--teal-soft);color:var(--teal)}
.badge-violet{background:var(--violet-soft);color:var(--violet)}
.badge-pink{background:var(--pink-soft);color:var(--pink)}
.badge-pending{background:#FEF3C7;color:#B45309}
.badge-gold{background:var(--gold-soft);color:#8A6B12}
.badge-brown{background:#F3E4CE;color:var(--brown)}

.empty{text-align:center;padding:44px 20px;color:var(--muted);font-size:14px}
.empty .em-icon{font-size:46px;display:block;margin-bottom:10px;opacity:.7}
.empty b{display:block;color:var(--brown);margin-bottom:4px}
.hide{display:none!important}

#appShell{display:none;min-height:100vh}
#appShell.active{display:block}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:256px;background:linear-gradient(180deg,#FFFFFF 0%,#FFF9F1 100%);border-right:1px solid var(--line-2);padding:20px 14px;z-index:100;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;}
.sb-brand{display:flex;align-items:center;gap:11px;padding:6px 8px 20px;border-bottom:1px solid var(--line-2);margin-bottom:16px}
.sb-brand .em{width:44px;height:44px;border-radius:14px;font-size:24px;background:linear-gradient(135deg,var(--orange),var(--pink));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(255,152,47,.28);flex-shrink:0;}
.sb-brand .nm{font-size:14px;font-weight:800;color:var(--dark);line-height:1.15;letter-spacing:-.2px}
.sb-brand .nm small{display:block;font-size:10px;color:var(--muted);letter-spacing:1px;font-weight:700;margin-top:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-sm);color:var(--brown);font-weight:600;font-size:13.5px;margin-bottom:3px;transition:all .18s;cursor:pointer;position:relative;}
.nav-item .ic{width:32px;height:32px;border-radius:9px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:.2s;}
.nav-item:hover{background:#fff;box-shadow:var(--shadow-sm);color:var(--dark)}
.nav-item:hover .ic{background:var(--orange-3)}
.nav-item.active{background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff;box-shadow:var(--shadow-orange);transform:translateX(2px);}
.nav-item.active .ic{background:rgba(255,255,255,.25);color:#fff}
.sb-footer{margin-top:auto;padding:16px 8px 4px;border-top:1px solid var(--line-2);font-size:11px;color:var(--muted);line-height:1.4}
.sb-footer .dot{display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin-right:6px}

.topbar{position:sticky;top:0;z-index:50;background:rgba(255,251,245,.85);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);padding:12px 22px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line-2);padding-top:max(12px,env(safe-area-inset-top));}
.topbar .menu-btn{display:none;width:40px;height:40px;border-radius:10px;background:var(--cream);color:var(--brown);font-size:20px;align-items:center;justify-content:center;}
.topbar .page-title{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--dark);flex:1;letter-spacing:-.3px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-date{font-size:12px;color:var(--brown);font-weight:700;padding:8px 14px;background:var(--cream);border-radius:20px;display:none;white-space:nowrap}
@media(min-width:900px){.tb-date{display:block}}
.user-chip{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:24px;background:#fff;border:1.5px solid var(--line);cursor:pointer;transition:.2s;flex-shrink:0}
.user-chip:hover{box-shadow:var(--shadow-sm);border-color:var(--orange-3)}
.user-chip .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--pink),var(--violet));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.user-chip .uinfo{display:none;line-height:1.2}
@media(min-width:700px){.user-chip .uinfo{display:block}}
.user-chip .uinfo b{display:block;font-size:13px;color:var(--dark)}
.user-chip .uinfo small{font-size:10px;color:var(--orange);text-transform:uppercase;letter-spacing:.8px;font-weight:800}

.main{margin-left:256px;min-height:100vh;display:flex;flex-direction:column}
.content{padding:24px;flex:1;max-width:1440px;width:100%;margin:0 auto}

.bd-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 22px;border-radius:var(--r-lg);margin-bottom:20px;box-shadow:var(--shadow);border:1.5px solid;}
.bd-banner.active{background:linear-gradient(135deg,#fff,var(--green-soft));border-color:#C6E8CF;}
.bd-banner.inactive{background:linear-gradient(135deg,#fff,var(--cream));border-color:var(--orange-3);}
.bd-banner-info{min-width:0;flex:1}
.bd-banner-title{font-family:var(--f-display);font-size:17px;font-weight:800;color:var(--dark);margin-bottom:4px}
.bd-banner-sub{font-size:13px;color:var(--brown);font-weight:600}
.bd-banner-sub b{color:var(--dark)}
.bd-banner .btn{flex-shrink:0}
@media(max-width:520px){.bd-banner{padding:14px 16px}.bd-banner .btn{width:100%}.bd-banner-title{font-size:15px}}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:20px}
.stat-grid-2{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.stat-card{background:#fff;border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden;border:1px solid var(--line-2);transition:.25s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat-card::after{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--orange),var(--orange-3))}
.stat-card.teal::after{background:linear-gradient(90deg,var(--teal),#3DCEC6)}
.stat-card.green::after{background:linear-gradient(90deg,var(--green),#6ED18A)}
.stat-card.red::after{background:linear-gradient(90deg,var(--red),#F4787C)}
.stat-card .sc-label{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.stat-card .sc-value{font-family:var(--f-display);font-size:28px;font-weight:800;color:var(--dark);line-height:1.1;letter-spacing:-.5px;word-break:break-word}
.stat-card .sc-sub{font-size:11.5px;color:var(--muted);margin-top:6px;font-weight:600}
.stat-card .sc-icon{position:absolute;right:16px;top:16px;font-size:26px;opacity:.14}

.qa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:22px}
.qa-btn{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 12px;background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);font-weight:700;font-size:12.5px;color:var(--dark);transition:.22s;border:2px solid transparent;text-align:center}
.qa-btn:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.qa-btn .qic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;transition:.2s}
.qa-btn.c1 .qic{background:linear-gradient(135deg,var(--orange),var(--orange-3));color:#fff;box-shadow:0 6px 16px rgba(255,152,47,.3)}
.qa-btn.c2 .qic{background:linear-gradient(135deg,var(--teal),#3DCEC6);color:#fff;box-shadow:0 6px 16px rgba(15,168,160,.3)}
.qa-btn.c3 .qic{background:linear-gradient(135deg,var(--pink),#F98AB0);color:#fff;box-shadow:0 6px 16px rgba(242,95,139,.3)}
.qa-btn.c4 .qic{background:linear-gradient(135deg,var(--violet),#A79BF0);color:#fff;box-shadow:0 6px 16px rgba(124,108,217,.3)}
.qa-btn.c5 .qic{background:linear-gradient(135deg,var(--gold),#F2C95F);color:#fff;box-shadow:0 6px 16px rgba(227,178,60,.3)}
.qa-btn.c6 .qic{background:linear-gradient(135deg,var(--brown),#B98055);color:#fff;box-shadow:0 6px 16px rgba(147,96,47,.3)}
.qa-btn:hover .qic{transform:scale(1.08) rotate(-4deg)}

.chart-grid{display:grid;grid-template-columns:1fr;gap:18px;margin-bottom:20px}
@media(min-width:900px){.chart-grid{grid-template-columns:1fr 1fr}}
.chart-wrap{position:relative;height:250px;width:100%}

.tbl-wrap{overflow-x:auto;border-radius:var(--r-sm);-webkit-overflow-scrolling:touch}
table.data{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
table.data th{background:linear-gradient(135deg,var(--cream-2),var(--cream));color:var(--brown);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:13px 14px;text-align:left;font-weight:800;white-space:nowrap;border-bottom:1.5px solid var(--line)}
table.data td{padding:13px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.data tr:hover td{background:var(--cream-2)}
table.data tr:last-child td{border-bottom:none}
table.data td.r,table.data th.r{text-align:right}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
table.data tr.row-pending td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
table.data tr.row-overdue td:first-child{box-shadow:inset 3px 0 0 var(--red)}
@media(max-width:680px){
  table.data thead{display:none}
  table.data,table.data tbody,table.data tr,table.data td{display:block;width:100%}
  table.data{min-width:0}
  table.data tr{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;padding:6px 4px;border:1px solid var(--line-2)}
  table.data tr.row-pending{border-left:3px solid var(--gold)}
  table.data tr.row-overdue{border-left:3px solid var(--red)}
  table.data tr:hover td{background:transparent}
  table.data td{padding:8px 16px;border:none;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right;word-break:break-word}
  table.data td::before{content:attr(data-label);font-weight:700;color:var(--brown);font-size:12px;text-align:left;flex-shrink:0;max-width:45%}
  table.data td.r{text-align:right}
  table.data td.empty{justify-content:center}
}

.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 0 0;margin-top:14px;border-top:1px solid var(--line-2);}
.pagination .pg-info{font-size:12.5px;color:var(--muted);font-weight:600}
.pagination .pg-controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pagination .pg-btn{min-width:36px;height:36px;padding:0 12px;border-radius:9px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:12.5px;color:var(--brown);display:inline-flex;align-items:center;justify-content:center;transition:.15s;}
.pagination .pg-btn.active{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:var(--shadow-orange)}
.pagination .pg-btn:disabled{opacity:.4;cursor:not-allowed}
.pagination .pg-btn:not(:disabled):not(.active):hover{border-color:var(--orange-3);background:var(--cream-2)}
.pagination .pg-perpage{padding:8px 10px;border-radius:9px;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--brown);background:#fff;min-height:36px;}
@media(max-width:520px){.pagination{flex-direction:column;align-items:stretch;gap:10px}.pagination .pg-controls{justify-content:center}}

.pay-filters{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.pay-filter-pill{padding:9px 16px;border-radius:20px;background:#fff;border:1.5px solid var(--line);color:var(--brown);font-weight:700;font-size:12.5px;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;transition:.15s;}
.pay-filter-pill:hover{border-color:var(--orange-3);background:var(--cream-2)}
.pay-filter-pill.active{background:linear-gradient(135deg,var(--orange),var(--orange-2));border-color:transparent;color:#fff;box-shadow:var(--shadow-orange)}
.pay-filter-pill .cnt{background:rgba(0,0,0,.08);padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:800}
.pay-filter-pill.active .cnt{background:rgba(255,255,255,.25)}

.modal-overlay{position:fixed;inset:0;background:rgba(45,29,17,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:1000;display:none;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-overlay.open{display:flex}
@media(min-width:640px){.modal-overlay{align-items:center;padding:20px}}
.modal{background:#fff;border-radius:var(--r-xl) var(--r-xl) 0 0;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;animation:modalUp .3s cubic-bezier(.4,0,.2,1)}
@media(min-width:640px){.modal{border-radius:var(--r-xl);max-height:88vh;animation:modalScale .3s cubic-bezier(.4,0,.2,1)}}
@keyframes modalUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes modalScale{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.modal-head h3{font-family:var(--f-display);font-size:18px;color:var(--dark);font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.modal-head .x{width:36px;height:36px;border-radius:10px;font-size:18px;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-head .x:hover{background:var(--cream);color:var(--dark)}
.modal-body{padding:22px 24px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line-2);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;flex-shrink:0}
@media(max-width:480px){.modal-head{padding:16px 18px}.modal-body{padding:18px}.modal-foot{padding:14px 18px}.modal-foot .btn{flex:1}}

#toastWrap{position:fixed;top:max(16px,env(safe-area-inset-top));right:16px;left:16px;z-index:2000;display:flex;flex-direction:column;gap:10px;max-width:360px;margin-left:auto;pointer-events:none}
@media(max-width:480px){#toastWrap{left:12px;right:12px;top:max(12px,env(safe-area-inset-top))}}
.toast{background:#fff;border-radius:var(--r-sm);padding:14px 16px;box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:600;display:flex;gap:11px;align-items:flex-start;animation:toastIn .3s cubic-bezier(.4,0,.2,1);border-left:4px solid var(--orange);pointer-events:auto}
.toast.ok{border-left-color:var(--green)}
.toast.err{border-left-color:var(--red)}
@keyframes toastIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

.loader{display:flex;align-items:center;justify-content:center;padding:44px;gap:12px;color:var(--muted);font-weight:600}
.spinner{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#globalLoading{position:fixed;inset:0;background:rgba(255,251,245,.75);backdrop-filter:blur(4px);z-index:3000;display:none;align-items:center;justify-content:center}
#globalLoading.show{display:flex}
#globalLoading .loader{background:#fff;padding:24px 32px;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);flex-direction:column}

/* ============ PRODUCT GRID — MOBILE 2 COLUMNS FIX ============ */
.pos-layout{display:grid;grid-template-columns:1fr;gap:18px;min-width:0}
@media(min-width:1000px){.pos-layout{grid-template-columns:1.45fr 1fr;align-items:start}}

/* Mobile-first: exactly 2 columns, no overflow */
.pos-products{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:10px;
  width:100%;
  max-width:100%;
}
/* Tablet: 3 columns */
@media(min-width:640px){
  .pos-products{grid-template-columns:repeat(3, minmax(0, 1fr));gap:12px}
}
/* Desktop: auto-fill */
@media(min-width:1000px){
  .pos-products{grid-template-columns:repeat(auto-fill, minmax(145px, 1fr));gap:12px}
}

.pos-prod{
  background:#fff;border-radius:var(--r);padding:9px;
  box-shadow:var(--shadow);cursor:pointer;transition:.2s;
  border:2px solid transparent;text-align:left;position:relative;
  overflow:hidden;display:flex;flex-direction:column;
  min-width:0;max-width:100%;
}
.pos-prod:hover{transform:translateY(-3px);border-color:var(--orange);box-shadow:var(--shadow-lg)}
.pos-prod:active{transform:scale(.97)}
.pos-prod .pp-img{
  width:100%;aspect-ratio:1/1;border-radius:8px;
  background:linear-gradient(135deg,var(--cream),#FFE9CE);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;margin-bottom:7px;overflow:hidden;
}
.pos-prod .pp-img img{width:100%;height:100%;object-fit:cover;display:block}
.pos-prod .pp-name{
  font-size:11.5px;font-weight:700;color:var(--dark);line-height:1.25;
  margin-bottom:4px;min-height:28px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word;
}
.pos-prod .pp-price{font-size:13px;font-weight:800;color:var(--orange);font-family:var(--f-display);margin-top:auto;}
.pos-prod .pp-stock{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos-prod .pp-stock.low{color:var(--red)}
.pos-prod .pp-sub{font-size:9px;color:var(--violet);font-weight:700;margin-bottom:2px;text-transform:uppercase;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Larger screens: comfortable sizes */
@media(min-width:640px){
  .pos-prod{padding:11px}
  .pos-prod .pp-img{font-size:36px;border-radius:10px;margin-bottom:9px}
  .pos-prod .pp-name{font-size:12.5px;min-height:20px}
  .pos-prod .pp-price{font-size:14px}
  .pos-prod .pp-stock{font-size:10.5px;margin-top:3px}
  .pos-prod .pp-sub{font-size:10px}
}
@media(min-width:1000px){
  .pos-prod .pp-img{font-size:38px}
}

.cart-box{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:calc(100vh - 120px);position:sticky;top:80px;border:1px solid var(--line-2);overflow:hidden}
@media(max-width:999px){.cart-box{position:static;max-height:none}}
.cart-head{padding:16px 20px;border-bottom:1px solid var(--line-2);font-weight:800;color:var(--dark);display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:15px;gap:8px}
.cart-head .badge{font-family:var(--f-body);font-size:11px;flex-shrink:0}
.cart-items{flex:1;overflow-y:auto;padding:12px;min-height:100px;max-height:340px;-webkit-overflow-scrolling:touch}
.cart-empty{text-align:center;padding:30px 14px;color:var(--muted);font-size:13px;line-height:1.6}
.cart-empty .em-icon{font-size:44px;display:block;margin-bottom:10px;opacity:.6}
.cart-line{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:var(--r-sm);background:var(--cream-2);margin-bottom:9px;border:1px solid var(--line-2)}
.cart-line .cl-info{flex:1;min-width:0}
.cart-line .cl-name{font-size:13px;font-weight:700;color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart-line .cl-meta{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:600}
.qty-ctl{display:flex;align-items:center;gap:3px;background:#fff;border-radius:20px;padding:3px;border:1.5px solid var(--line);flex-shrink:0}
.qty-ctl button{width:30px;height:30px;border-radius:50%;background:var(--cream);color:var(--brown);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.15s}
.qty-ctl button:hover{background:var(--orange);color:#fff}
.qty-ctl span{min-width:26px;text-align:center;font-weight:800;font-size:13px}
.cart-foot{padding:14px 20px 18px;border-top:1px solid var(--line-2);background:linear-gradient(180deg,#fff,var(--cream-2))}

.cart-summary{margin-bottom:12px;padding:12px 14px;background:#fff;border-radius:var(--r-sm);border:1px solid var(--line-2)}
.cart-summary .cs-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;font-weight:600;color:var(--brown)}
.cart-summary .cs-row.total{font-family:var(--f-display);font-size:18px;font-weight:800;color:var(--dark);padding-top:10px;margin-top:6px;border-top:1.5px dashed var(--line);letter-spacing:-.3px;}
.cart-summary .cs-row .mono{font-weight:800;color:var(--dark);font-size:14px}
.cart-summary .cs-row.total .mono{font-size:22px;color:var(--orange)}
.discount-input-wrap{display:flex;align-items:center;gap:6px;max-width:130px}
.discount-input-wrap .cur{font-weight:800;color:var(--brown);font-size:13px}
.discount-input-wrap input{width:100%;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;font-weight:800;text-align:right;min-height:36px;font-size:13px;}
.discount-input-wrap input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,152,47,.14)}
.cart-note{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-size:12.5px;resize:vertical;min-height:56px;margin-bottom:12px;background:#fff;font-family:inherit;}
.cart-note:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,152,47,.14)}
.cart-note::placeholder{color:#B9A692}
.pay-methods{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.pay-methods button{padding:10px 4px;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:11.5px;color:var(--brown);transition:.15s;display:flex;flex-direction:column;align-items:center;gap:3px}
.pay-methods button:hover{background:var(--cream-2)}
.pay-methods button.active{background:linear-gradient(135deg,var(--orange),var(--orange-2));border-color:transparent;color:#fff;box-shadow:var(--shadow-orange)}
.pay-methods button.active[data-pay="Pending"]{background:linear-gradient(135deg,var(--gold),#F2C95F);box-shadow:0 8px 24px rgba(227,178,60,.28)}
.pay-methods button .pm-ic{font-size:16px}

.pos-cats{display:flex;gap:9px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.cat-pill{padding:10px 18px;border-radius:22px;background:#fff;color:var(--brown);font-weight:700;font-size:13px;white-space:nowrap;border:1.5px solid var(--line);transition:.2s;flex-shrink:0}
.cat-pill:hover{border-color:var(--orange-3);background:var(--cream-2)}
.cat-pill.active{background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff;border-color:transparent;box-shadow:var(--shadow-orange);transform:translateY(-1px)}
.pos-subs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sub-pill{padding:8px 14px;border-radius:20px;background:var(--cream-2);color:var(--brown);font-weight:700;font-size:12.5px;border:1.5px solid var(--line-2);transition:.2s}
.sub-pill:hover{border-color:var(--orange-3);background:var(--cream)}
.sub-pill.active{background:#fff;color:var(--orange);border-color:var(--orange);box-shadow:var(--shadow-sm)}

.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filter-bar .input{max-width:220px}
.filter-bar select.input{max-width:180px}
@media(max-width:520px){.filter-bar .input,.filter-bar select.input,.filter-bar .btn{max-width:none;flex:1 1 auto;min-width:0}}
#receiptPrint{display:none}
@media print{
  body *{visibility:hidden}
  #receiptPrint,#receiptPrint *{visibility:visible}
  #receiptPrint{display:block;position:absolute;left:0;top:0;width:100%}
  @page { size: A4; margin: 12mm; }
}
#sidebarBackdrop{position:fixed;inset:0;background:rgba(45,29,17,.45);backdrop-filter:blur(2px);z-index:99;display:none}
#sidebarBackdrop.show{display:block}
@media(max-width:900px){.sidebar{transform:translateX(-100%);box-shadow:var(--shadow-lg);width:min(280px,80vw)}.sidebar.open{transform:none}.main{margin-left:0}.topbar .menu-btn{display:flex}.content{padding:16px}.page-title{font-size:18px!important}}
@media(max-width:480px){
  .content{padding:12px}
  .card{padding:16px;border-radius:var(--r)}
  .stat-card{padding:14px 16px}
  .stat-card .sc-value{font-size:22px}
  .qa-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .qa-btn{padding:16px 8px;font-size:11.5px}
  .qa-btn .qic{width:42px;height:42px;font-size:19px}
  .pay-methods{grid-template-columns:repeat(2,1fr)}
  .pos-cats{gap:6px}
  .cat-pill{padding:8px 14px;font-size:12px}
  .sub-pill{padding:6px 11px;font-size:11.5px}
  .cart-foot{padding:12px 14px 14px}
  .cart-head{padding:12px 14px}
  .cart-items{padding:10px}
}
@media(max-width:360px){
  .pos-products{gap:8px}
  .pos-prod{padding:7px}
  .pos-prod .pp-name{font-size:11px}
  .pos-prod .pp-price{font-size:12.5px}
}

#authBlock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px;background:radial-gradient(circle at 15% 20%,rgba(255,171,69,.35) 0%,transparent 45%),radial-gradient(circle at 85% 15%,rgba(242,95,139,.22) 0%,transparent 50%),linear-gradient(135deg,#FFF4E5 0%,#FFE5CC 45%,#F5D9B8 100%);}
#authBlock .auth-card{background:rgba(255,255,255,.92);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.9);border-radius:var(--r-xl);padding:40px 32px;max-width:400px;width:100%;text-align:center;box-shadow:var(--shadow-lg);}
#authBlock .emoji{font-size:56px;margin-bottom:14px}
#authBlock h2{font-family:var(--f-display);color:var(--dark);margin-bottom:8px;font-size:22px}
#authBlock p{color:var(--muted);font-size:13.5px;margin-bottom:22px;line-height:1.5}

.img-preview-wrap{margin-top:8px;display:flex;align-items:center;gap:12px;padding:10px;background:var(--cream-2);border:1px dashed var(--line);border-radius:var(--r-sm);}
.img-preview-wrap .prev-box{width:64px;height:64px;border-radius:10px;background:linear-gradient(135deg,var(--cream),#FFE9CE);display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;flex-shrink:0;border:1px solid var(--line-2);}
.img-preview-wrap .prev-box img{width:100%;height:100%;object-fit:cover}
.img-preview-wrap .prev-txt{font-size:11.5px;color:var(--muted);line-height:1.4;word-break:break-all}

.admin-tree-cat{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--line-2);margin-bottom:14px;overflow:hidden;}
.admin-tree-cat>.cat-head{display:flex;align-items:center;gap:10px;padding:14px 18px;background:linear-gradient(135deg,var(--cream-2),var(--cream));border-bottom:1px solid var(--line);flex-wrap:wrap;}
.admin-tree-cat>.cat-head .cat-name{font-family:var(--f-display);font-size:15px;font-weight:800;color:var(--dark);flex:1;min-width:120px}
.admin-tree-cat .cat-body{padding:12px 14px}
.admin-sub{border:1px solid var(--line-2);border-radius:var(--r-sm);margin-bottom:10px;overflow:hidden;background:var(--cream-2)}
.admin-sub>.sub-head{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap;background:rgba(255,255,255,.6);border-bottom:1px solid var(--line-2);}
.admin-sub>.sub-head .sub-name{font-weight:800;color:var(--brown);font-size:13px;flex:1;min-width:100px}
.admin-sub .sub-products{padding:10px}
.admin-prod-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#fff;margin-bottom:7px;border:1px solid var(--line-2);}
.admin-prod-row .apr-img{width:44px;height:44px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,var(--cream),#FFE9CE);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;}
.admin-prod-row .apr-img img{width:100%;height:100%;object-fit:cover}
.admin-prod-row .apr-info{flex:1;min-width:0}
.admin-prod-row .apr-name{font-weight:700;font-size:13px;color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-prod-row .apr-meta{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}
.admin-prod-row .apr-price{font-weight:800;color:var(--orange);font-size:13px;font-family:var(--f-display);flex-shrink:0}
.admin-prod-row .apr-actions{display:flex;gap:5px;flex-shrink:0}
.icon-btn{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:var(--cream-2);color:var(--brown);font-size:14px;border:1px solid var(--line-2);transition:.15s;}
.icon-btn:hover{background:var(--cream);color:var(--dark)}
.icon-btn.danger{color:var(--red)}
.icon-btn.danger:hover{background:var(--red-soft)}
@media(max-width:520px){.admin-tree-cat>.cat-head{padding:12px 12px}.admin-sub .sub-products{padding:8px}.admin-prod-row{gap:8px;padding:8px}.admin-prod-row .apr-img{width:38px;height:38px}.admin-prod-row .apr-price{font-size:12px}}

.inv-tree-cat{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--line-2);margin-bottom:14px;overflow:hidden;}
.inv-tree-cat>.cat-head{display:flex;align-items:center;gap:10px;padding:14px 18px;background:linear-gradient(135deg,var(--cream-2),var(--cream));border-bottom:1px solid var(--line);flex-wrap:wrap;cursor:pointer;}
.inv-tree-cat>.cat-head .cat-name{font-family:var(--f-display);font-size:15px;font-weight:800;color:var(--dark);flex:1;min-width:120px}
.inv-tree-cat>.cat-head .cat-sum{font-size:11.5px;color:var(--muted);font-weight:700;background:#fff;padding:4px 10px;border-radius:10px;border:1px solid var(--line-2)}
.inv-tree-cat .cat-body{padding:12px 14px}
.inv-sub{border:1px solid var(--line-2);border-radius:var(--r-sm);margin-bottom:10px;overflow:hidden;background:var(--cream-2)}
.inv-sub>.sub-head{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap;background:rgba(255,255,255,.6);border-bottom:1px solid var(--line-2);cursor:pointer;}
.inv-sub>.sub-head .sub-name{font-weight:800;color:var(--brown);font-size:13px;flex:1;min-width:100px}
.inv-sub .sub-products{padding:10px}
.inv-prod-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#fff;margin-bottom:7px;border:1px solid var(--line-2);}
.inv-prod-row.low{border-color:#F5C0C0;background:#FFF9F9}
.inv-prod-row .ipr-img{width:44px;height:44px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,var(--cream),#FFE9CE);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;}
.inv-prod-row .ipr-img img{width:100%;height:100%;object-fit:cover}
.inv-prod-row .ipr-info{flex:1;min-width:0}
.inv-prod-row .ipr-name{font-weight:700;font-size:13px;color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-prod-row .ipr-meta{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}
.inv-prod-row .ipr-stock{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.inv-prod-row .ipr-stock input{width:76px;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;text-align:right;font-weight:800;font-size:14px;background:#fff;min-height:38px;}
.inv-prod-row .ipr-stock input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,152,47,.14)}
.inv-prod-row .ipr-stock input.low{border-color:#E5A0A0;background:#FFF5F5;color:var(--red)}
.inv-prod-row .ipr-actions{display:flex;gap:5px;flex-shrink:0}
@media(max-width:520px){.inv-tree-cat>.cat-head{padding:12px}.inv-sub .sub-products{padding:8px}.inv-prod-row{gap:8px;padding:8px}.inv-prod-row .ipr-img{width:38px;height:38px}.inv-prod-row .ipr-stock input{width:64px;font-size:13px;padding:6px 8px;min-height:34px}}

.ilc-wrap{max-width:720px;margin:0 auto;}
.ilc-card{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px;border:1px solid var(--line-2);margin-bottom:16px;}
.ilc-card h3{font-family:var(--f-display);font-size:16px;font-weight:800;color:var(--dark);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.ilc-card h3 .chip{width:32px;height:32px;border-radius:10px;background:var(--cream);display:inline-flex;align-items:center;justify-content:center;font-size:16px;}
.ilc-out{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.ilc-out input{flex:1;min-width:180px;padding:12px 15px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-family:ui-monospace,monospace;font-size:12.5px;background:var(--cream-2);min-height:46px;}
.ilc-out input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,152,47,.14)}
.ilc-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.ilc-actions .btn{flex:1;min-width:120px}
.ilc-preview{margin-top:14px;padding:14px;background:var(--cream-2);border-radius:var(--r-sm);border:1px dashed var(--line);display:flex;align-items:center;gap:14px;}
.ilc-preview .ilc-prev-box{width:88px;height:88px;border-radius:12px;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,var(--cream),#FFE9CE);display:flex;align-items:center;justify-content:center;font-size:32px;border:1px solid var(--line-2);}
.ilc-preview .ilc-prev-box img{width:100%;height:100%;object-fit:cover}
.ilc-preview .ilc-prev-txt{font-size:12.5px;color:var(--muted);line-height:1.5;word-break:break-all}
.ilc-hint{font-size:12px;color:var(--muted);line-height:1.55;margin-top:10px}
.ilc-hint code{background:var(--cream);padding:2px 6px;border-radius:5px;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--brown);}

.act-type-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:14px;font-size:11.5px;font-weight:800;letter-spacing:.2px;text-transform:uppercase;background:var(--cream);color:var(--brown);white-space:nowrap;}
.act-type-sale{background:var(--green-soft);color:var(--green)}
.act-type-sale_edit{background:var(--gold-soft);color:#8A6B12}
.act-type-sale_cancel{background:var(--red-soft);color:var(--red)}
.act-type-order{background:var(--teal-soft);color:var(--teal)}
.act-type-product{background:var(--orange-3);color:#7A3D00}
.act-type-category{background:var(--violet-soft);color:var(--violet)}
.act-type-inventory{background:var(--teal-soft);color:var(--teal)}
.act-type-customer{background:var(--pink-soft);color:var(--pink)}
.act-type-expense{background:#FFE7D6;color:#B23A0A}
.act-type-day{background:var(--cream);color:var(--brown)}
.act-row{cursor:pointer}
.act-user{display:flex;flex-direction:column;gap:2px;line-height:1.25}
.act-user b{font-size:13px;color:var(--dark)}
.act-user small{font-size:11px;color:var(--muted)}

.diff-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.diff-table thead th{background:var(--cream-2);color:var(--brown);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;text-align:left;border-bottom:1px solid var(--line-2)}
.diff-table td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top;word-break:break-word}
.diff-table tr:last-child td{border-bottom:none}
.diff-table .d-field{font-weight:800;color:var(--brown);font-size:12px}
.diff-table .d-old{color:var(--red);text-decoration:line-through;font-family:ui-monospace,monospace;font-size:11.5px}
.diff-table .d-new{color:var(--green);font-weight:700;font-family:ui-monospace,monospace;font-size:11.5px}
.diff-table .d-arrow{color:var(--muted);padding:0 4px;font-size:11px}
@media(max-width:520px){
  .diff-table, .diff-table thead, .diff-table tbody, .diff-table tr, .diff-table td {display:block;width:100%}
  .diff-table thead{display:none}
  .diff-table tr{border:1px solid var(--line-2);border-radius:8px;margin-bottom:8px;padding:8px 10px}
  .diff-table td{border:none;padding:4px 0}
  .diff-table .d-field{display:block;margin-bottom:4px}
}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, get, set, update, push, remove, onValue, runTransaction, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA9lcaEUztt8j1q44P0FrC3PKQ58sseV9o",
  authDomain: "softy-ice-cream-shop.firebaseapp.com",
  databaseURL: "https://softy-ice-cream-shop-default-rtdb.firebaseio.com",
  projectId: "softy-ice-cream-shop",
  storageBucket: "softy-ice-cream-shop.firebasestorage.app",
  messagingSenderId: "1075750027667",
  appId: "1:1075750027667:web:85eb50c080e1704b18a866"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const MAX_ACTIVITIES = 10000;

const State = {
  user:null, profile:null,
  categories:{}, subcategories:{}, products:{}, customers:{}, sales:{}, orders:{},
  expenses:{}, inventory:{}, settings:{}, closings:{}, businessDays:{},
  stockMovements:{}, activities:{},
  activeDayId: null, activeDay: null,
  cart:[], currentPage:'dashboard',
  chartInstances:{}, listeners:[],
  posCustomer:null, posSelectedCat:null, posSelectedSub:null, posSelectedPay:'Cash',
  cartDiscount:0, cartNote:'',
  orderSubTab:'new',
  orderCart:[], orderCustomer:null, orderSelectedCat:null, orderSelectedSub:null,
  orderPay:'Cash', orderDiscount:0, orderNote:'', orderDate:'', orderTime:'',
  orderPage:1, orderPerPage:10, orderDateFilterMode:'today', orderCustomDate:'',
  editingOrderId:null, editingOrder:null,
  editingSaleId:null, editingSale:null,
  salesPage:1, salesPerPage:10, salesPayFilter:'All', salesSearch:'', salesDate:undefined,
  dashboardOrdersPage:1, dashboardOrdersPerPage:10,
  repFromDate:'', repToDate:'',
  activityPage:1, activityPerPage:10, activityTypeFilter:'All', activityUserFilter:'All',
  activityDateFilter:'', activitySearch:'',
  invExpandedCats: new Set(),
  invExpandedSubs: new Set(),
  imgLinkInput:'', imgLinkOutput:'',
  busy: false
};

const roleOf = () => State.profile?.role || 'staff';
const isAdmin = () => ['owner','admin'].includes(roleOf());
const roleLabelOf = () => { const r = roleOf(); return (r==='owner'||r==='admin') ? 'Admin' : (r==='manager'?'Manager':'Staff'); };

const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtINR = n => '₹' + (Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const fmtDate = d => { if(!d) return '—'; const x=new Date(d); if(isNaN(x)) return '—'; return x.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtTime = d => { if(!d) return '—'; const x=new Date(d); if(isNaN(x)) return '—'; return x.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}); };
const fmtDateTime = d => { if(!d) return '—'; return fmtDate(d)+' · '+fmtTime(d); };
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const dateToISO = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const nowISO = () => new Date().toISOString();

const PLACEHOLDER_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#FFF4E5"/><text x="50%" y="54%" font-size="80" text-anchor="middle" dominant-baseline="middle">🍦</text></svg>`
);
function imgOrPlaceholder(url){ return (url && String(url).trim()) ? url : PLACEHOLDER_IMG; }
window.__imgFail = function(img){ img.onerror=null; img.src = PLACEHOLDER_IMG; };

function toast(msg, type='ok'){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span style="font-size:16px;flex-shrink:0">${type==='ok'?'✅':type==='err'?'⚠️':'ℹ️'}</span><span>${esc(msg)}</span>`;
  $('#toastWrap').appendChild(el);
  setTimeout(()=>{ el.style.transition='.3s'; el.style.opacity='0'; el.style.transform='translateX(40px)'; setTimeout(()=>el.remove(),300); }, 3800);
}
const showLoading = v => $('#globalLoading').classList.toggle('show', v);

function openModal(title, bodyHTML, footHTML=''){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHTML;
  $('#modalFoot').innerHTML = footHTML;
  $('#modalOverlay').classList.add('open');
}
window.closeModal = ()=> $('#modalOverlay').classList.remove('open');

function confirmDialog(title, text, onYes, yesLabel='Confirm', danger=true){
  openModal(title,
    `<p style="font-size:14px;line-height:1.65;color:var(--brown);white-space:pre-line">${esc(text)}</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn ${danger?'btn-danger':'btn-primary'}" id="confirmYes">${esc(yesLabel)}</button>`);
  $('#confirmYes').onclick = ()=>{ closeModal(); onYes(); };
}

function fmtDuration(ms){
  if (!ms || ms < 0) ms = 0;
  const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000), s = Math.floor((ms%60000)/1000);
  return `${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
}

/* ============================================================
   ACTIVITY DIFF HELPERS
   ============================================================ */
const FIELD_ORDER = [
  'name','price','stock','minStock','active','image','description',
  'categoryId','subcategoryId','categoryName','subcategoryName',
  'customerName','customerPhone','scheduledDate','scheduledTime',
  'paymentMethod','subtotal','discount','total','note',
  'amount','date','category','itemsSummary'
];
const FIELD_LABELS = {
  name:'Name', price:'Price', stock:'Stock', minStock:'Min Stock', active:'Status',
  image:'Image URL', description:'Description',
  categoryId:'Category ID', subcategoryId:'Subcategory ID',
  categoryName:'Category', subcategoryName:'Subcategory',
  customerName:'Customer Name', customerPhone:'Customer Phone',
  scheduledDate:'Scheduled Date', scheduledTime:'Scheduled Time',
  paymentMethod:'Payment Method', subtotal:'Subtotal', discount:'Discount', total:'Total',
  note:'Note', amount:'Amount', date:'Date', category:'Category', itemsSummary:'Items'
};
const NUMERIC_FIELDS = new Set(['price','stock','minStock','subtotal','discount','total','amount']);
const MONEY_FIELDS = new Set(['price','subtotal','discount','total','amount']);

function normalizeVal(field, v){
  if (v === undefined || v === null) return '';
  if (field === 'active') return v === false ? 'Inactive' : 'Active';
  if (MONEY_FIELDS.has(field)) return '₹' + (Number(v)||0).toLocaleString('en-IN');
  if (NUMERIC_FIELDS.has(field)) return String(Number(v)||0);
  return String(v);
}

function buildDiff(before={}, after={}){
  const diff = {};
  const allKeys = new Set([...Object.keys(before||{}), ...Object.keys(after||{})]);
  for (const k of allKeys) {
    if (!FIELD_ORDER.includes(k)) continue;
    const b = before?.[k];
    const a = after?.[k];
    const bn = normalizeVal(k, b);
    const an = normalizeVal(k, a);
    if (bn !== an) diff[k] = { from: b ?? null, to: a ?? null };
  }
  return diff;
}

function summarizeItems(items){
  return (items||[]).map(i=>`${i.productName}${i.subcategoryName?' ('+i.subcategoryName+')':''} ×${i.qty}`).join(', ');
}

/* ============================================================
   ACTIVITY LOG
   ============================================================ */
async function recordActivity({type, description, recordId=null, details=null, diff=null}){
  if (!State.user) return;
  const payload = {
    type, description,
    username: State.profile?.name || State.user.email || 'Unknown',
    email: State.user.email || '',
    role: roleOf(),
    recordId: recordId || null,
    timestamp: serverTimestamp(),
    timestampLocal: nowISO(),
  };
  if (diff && typeof diff === 'object' && Object.keys(diff).length) payload.diff = diff;
  if (details && typeof details === 'object') payload.details = details;
  try {
    await push(ref(db,'activities'), payload);
    pruneActivitiesIfNeeded().catch(()=>{});
  } catch(e){ console.warn('Activity log failed:', e?.code || e?.message); }
}

let pruneInFlight = false;
async function pruneActivitiesIfNeeded(){
  if (pruneInFlight) return;
  pruneInFlight = true;
  try {
    const snap = await get(ref(db,'activities'));
    const all = snap.val() || {};
    const keys = Object.keys(all);
    const total = keys.length;
    if (total <= MAX_ACTIVITIES) return;
    const entries = keys.map(k => {
      const a = all[k];
      const t = typeof a.timestamp === 'number' ? a.timestamp : new Date(a.timestampLocal || a.timestamp || 0).getTime();
      return { key:k, t: isNaN(t) ? 0 : t };
    });
    entries.sort((a,b)=> a.t - b.t);
    const toRemove = entries.slice(0, total - MAX_ACTIVITIES);
    const updates = {};
    toRemove.forEach(e => { updates['activities/'+e.key] = null; });
    await update(ref(db), updates);
  } catch(e){ console.warn('Activity prune failed:', e?.code || e?.message); }
  finally { pruneInFlight = false; }
}

/* ============================================================
   BUSINESS DAY
   ============================================================ */
function getActiveStartMs(){
  const d = State.activeDay; if (!d) return null;
  if (typeof d.startAtServer === 'number' && d.startAtServer > 0) return d.startAtServer;
  if (typeof d.startAtLocal === 'number' && d.startAtLocal > 0) return d.startAtLocal;
  if (d.startedAtLocalISO) { const t = new Date(d.startedAtLocalISO).getTime(); if (!isNaN(t)) return t; }
  return null;
}
function activeBusinessDate(){ return State.activeDay?.businessDate || todayISO(); }
function activeDaySales(){
  const id = State.activeDayId; if (!id) return [];
  return Object.entries(State.sales||{}).map(([k,s])=>({id:k,...s}))
    .filter(s => s.businessDayId === id && !s.cancelled)
    .sort((a,b)=> new Date(b.dateTime||b.createdAt||0) - new Date(a.dateTime||a.createdAt||0));
}
function activeDayTotals(){
  const sales = activeDaySales();
  let total = 0, items = 0;
  const byPay = { Cash:0, UPI:0, Card:0, Pending:0 };
  sales.forEach(s => {
    total += Number(s.total) || 0;
    (s.items||[]).forEach(it => items += Number(it.qty) || 0);
    const pm = s.paymentMethod || 'Cash';
    byPay[pm] = (byPay[pm] || 0) + (Number(s.total) || 0);
  });
  return { total, items, orders: sales.length, byPay };
}

function subsForCat(catId){ return Object.entries(State.subcategories).filter(([id,s])=>s.categoryId===catId).sort((a,b)=>(a[1].order||0)-(b[1].order||0)); }
function productsFor(catId, subId){ return Object.entries(State.products).filter(([id,p])=> p.categoryId===catId && (p.subcategoryId||'')===(subId||'')).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||'')); }
function isLegacyProduct(p){ return !p.subcategoryId && p.variants && p.variants.length > 0; }
function productPrice(p){
  if(p.price != null) return Number(p.price)||0;
  if(p.prices){ const firstV = (p.variants && p.variants[0]) || Object.keys(p.prices)[0]; return Number(p.prices[firstV])||0; }
  return 0;
}
function subName(subId){ if(!subId) return 'General'; return State.subcategories[subId]?.name || 'General'; }
function productStock(p){ return Math.max(0, Number(p?.stock)||0); }

async function adjustProductStock(pid, delta, meta={}){
  const pidRef = ref(db, 'products/'+pid+'/stock');
  const result = await runTransaction(pidRef, (current)=>{
    const cur = Math.max(0, Number(current)||0);
    return Math.max(0, cur + Number(delta||0));
  });
  if (!result.committed) return { ok:false };
  if (meta && Object.keys(meta).length) {
    try {
      await push(ref(db,'stockMovements'), {
        productId: pid, productName: meta.productName || '',
        delta: Number(delta)||0, from: Number(meta.from)||0,
        to: Number(result.snapshot.val())||0,
        reason: meta.reason || '', refId: meta.refId || null,
        businessDayId: State.activeDayId || null,
        by: State.user?.uid || null, byName: State.profile?.name || '', at: nowISO()
      });
    } catch(e){}
  }
  return { ok:true, value: Number(result.snapshot.val())||0 };
}
async function setProductStock(pid, value, meta={}){
  const pidRef = ref(db, 'products/'+pid+'/stock');
  const result = await runTransaction(pidRef, ()=> Math.max(0, Math.floor(Number(value)||0)));
  if (!result.committed) return { ok:false };
  if (meta && Object.keys(meta).length) {
    try {
      await push(ref(db,'stockMovements'), {
        productId: pid, productName: meta.productName || '',
        delta: (Number(result.snapshot.val())||0) - (Number(meta.from)||0),
        from: Number(meta.from)||0, to: Number(result.snapshot.val())||0,
        reason: meta.reason || 'Set exact',
        businessDayId: State.activeDayId || null,
        by: State.user?.uid || null, byName: State.profile?.name || '', at: nowISO()
      });
    } catch(e){}
  }
  return { ok:true, value: Number(result.snapshot.val())||0 };
}

function extractDriveFileId(url){
  if (!url) return null;
  const s = String(url).trim();
  let m = s.match(/\/file\/d\/([a-zA-Z0-9_-]{10,})/); if (m) return m[1];
  m = s.match(/[?&]id=([a-zA-Z0-9_-]{10,})/); if (m) return m[1];
  m = s.match(/^([a-zA-Z0-9_-]{20,})$/); if (m) return m[1];
  return null;
}
function convertDriveLink(url){ const id = extractDriveFileId(url); return id ? 'https://lh3.googleusercontent.com/d/'+id : null; }

window.openProfileMenu = ()=>{
  const p = State.profile || {};
  openModal('My Account',
    `<div style="display:flex;gap:16px;align-items:center;margin-bottom:18px">
      <div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--pink),var(--violet));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;box-shadow:0 8px 20px rgba(255,152,47,.3);flex-shrink:0">${esc((p.name||'?')[0].toUpperCase())}</div>
      <div style="min-width:0"><b style="font-size:16px;color:var(--dark);display:block;word-break:break-word">${esc(p.name||'')}</b>
        <span class="badge badge-orange" style="margin-top:6px">${roleLabelOf()}</span><br>
        <small style="color:var(--muted);font-size:12px;margin-top:6px;display:inline-block;word-break:break-all">${esc(State.user?.email||'')}</small>
      </div>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Close</button>
     <button class="btn btn-danger" onclick="handleLogout()">Sign Out</button>`);
};
window.handleLogout = async ()=>{ closeModal(); detachListeners(); try{ await signOut(auth); }catch(e){} window.location.replace('index.html'); };

onAuthStateChanged(auth, async (user)=>{
  if(user){
    showLoading(true);
    try{
      const snap = await get(ref(db,'users/'+user.uid));
      if(!snap.exists()){ toast('No profile found','err'); await signOut(auth); window.location.replace('index.html'); return; }
      const profile = snap.val();
      if(profile.active === false){ toast('Account deactivated','err'); await signOut(auth); window.location.replace('index.html'); return; }
      State.user = user; State.profile = profile;
      $('#authBlock').style.display = 'none';
      $('#appShell').classList.add('active');
      $('#userName').textContent = profile.name || user.email;
      $('#userRole').textContent = roleLabelOf();
      $('#userAvatar').textContent = (profile.name || user.email || '?')[0].toUpperCase();
      $('#topDate').textContent = new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
      if(isAdmin()){
        const sSnap = await get(ref(db,'settings'));
        if(!sSnap.exists()){
          await set(ref(db,'settings'), {
            businessName:'Marshmallow Ice Creams & Cakes', phone:'', address:'', currency:'INR',
            openTime:'09:00', closeTime:'22:00'
          });
        }
      }
      attachListeners();
      navigateTo('dashboard');
      setInterval(()=>{
        const el = document.getElementById('bdTimer');
        if (el && State.activeDay) {
          const start = getActiveStartMs();
          if (start) el.textContent = fmtDuration(Date.now() - start);
        }
      }, 1000);
    } catch(err){
      console.error(err); toast('Failed to load profile: ' + (err.message || err.code || 'unknown'),'err');
      await signOut(auth); window.location.replace('index.html');
    } finally { showLoading(false); }
  } else {
    detachListeners();
    $('#appShell').classList.remove('active');
    $('#authBlock').style.display = 'flex';
    setTimeout(()=>{ window.location.replace('index.html'); }, 800);
  }
});

function attachListeners(){
  const add = (path, cb)=>{
    const un = onValue(ref(db,path), snap=>cb(snap.val()||{}), err=>console.warn(path,err.code));
    State.listeners.push(un);
  };
  add('categories',    v=>{ State.categories = v;      rerenderActive(); });
  add('subcategories', v=>{ State.subcategories = v;   rerenderActive(); });
  add('products',      v=>{ State.products = v;        rerenderActive(); });
  add('customers',     v=>{ State.customers = v;       if(State.currentPage==='customers') renderCustomers(); });
  add('sales',         v=>{ State.sales = v;           rerenderActive(); });
  add('orders',        v=>{ State.orders = v;          rerenderActive(); });
  add('closings',      v=>{ State.closings = v;        if(State.currentPage==='closing') renderClosing(); });
  add('inventory',     v=>{ State.inventory = v; });
  add('stockMovements', v=>{ State.stockMovements = v; });
  add('businessDays',  v=>{ State.businessDays = v;    updateActiveDay(); });
  if(isAdmin()){
    add('expenses', v=>{ State.expenses = v; if(State.currentPage==='expenses') renderExpenses(); });
    add('activities', v=>{ State.activities = v; if(State.currentPage==='activity') renderActivityLog(); });
  }
  const unActive = onValue(ref(db,'activeBusinessDay'), snap=>{
    const val = snap.val();
    const changed = (val || null) !== State.activeDayId;
    State.activeDayId = val || null;
    if (changed) updateActiveDay(true);
    else updateActiveDay();
  });
  State.listeners.push(unActive);
  rerenderActive();
}
function updateActiveDay(force=false){
  State.activeDay = State.activeDayId ? (State.businessDays[State.activeDayId] || null) : null;
  const el = document.getElementById('bdTimer');
  if (el && State.activeDay) { const start = getActiveStartMs(); if (start) el.textContent = fmtDuration(Date.now() - start); }
  const p = State.currentPage;
  if (p === 'dashboard') renderDashboard();
  else if (p === 'pos') { if (force) renderPOS(); else renderPOSProductsOnly(); }
  else if (p === 'orders') { if (force) renderOrders(); else { drawOrdersList(); renderOrdersCart(); } }
  else if (p === 'sales') drawSalesTable();
  else if (p === 'closing') renderClosing();
}
function rerenderActive(){
  const p = State.currentPage;
  if(p==='dashboard') renderDashboard();
  else if(p==='pos') renderPOSProductsOnly();
  else if(p==='orders'){ if (State.orderSubTab==='list') drawOrdersList(); else if (State.orderSubTab==='new') renderOrdersProductsOnly(); }
  else if(p==='sales') { drawSalesTable(); drawPayFilters(); }
  else if(p==='products') renderProducts();
  else if(p==='inventory') renderInventory();
  else if(p==='customers') renderCustomers();
  else if(p==='expenses') renderExpenses();
  else if(p==='reports') { if (document.getElementById('reportBody')) drawReports(); }
  else if(p==='closing') renderClosing();
  else if(p==='activity') { if (document.getElementById('activityBody')) drawActivityTable(); }
}
function detachListeners(){ State.listeners.forEach(un=>{ try{un();}catch(e){} }); State.listeners = []; }

window.startBusinessDay = async ()=>{
  if (State.busy) return;
  if (State.activeDayId) { toast('A business day is already active','err'); return; }
  const now = new Date();
  confirmDialog('Start New Business Day',
    `Start a new business day now?\n\nDate: ${now.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}\nTime: ${now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true})}\n\nAll sales from this point will be recorded under this business day.`,
    async ()=>{
      State.busy = true; showLoading(true);
      try {
        const newDayId = 'BD_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
        const result = await runTransaction(ref(db,'activeBusinessDay'), (current)=>{ if (current) return; return newDayId; });
        if (!result.committed) { toast('A business day is already active. Please refresh.','err'); return; }
        try {
          const isoDate = dateToISO(now);
          await set(ref(db,'businessDays/'+newDayId), {
            dayId: newDayId, businessDate: isoDate, startAtLocal: Date.now(),
            startAtServer: serverTimestamp(), status:'active',
            startedBy: State.user.uid, startedByName: State.profile?.name || '',
            startedAtLocalISO: now.toISOString()
          });
          await recordActivity({ type:'day_started', description:'Started business day for '+isoDate, recordId:newDayId });
          toast('Business day started!');
        } catch (e) { try { await remove(ref(db,'activeBusinessDay')); } catch(_){} throw e; }
      } catch (e) { toast('Error: ' + (e.message || e.code || 'unknown'), 'err'); }
      finally { State.busy = false; showLoading(false); }
    }, 'Start Day', false);
};

window.closeBusinessDay = async ()=>{
  if (State.busy) return;
  const dayId = State.activeDayId;
  if (!dayId) { toast('No active business day','err'); return; }
  const preTotals = activeDayTotals();
  const now = new Date();
  confirmDialog('Close Business Day',
    `Close the current business day?\n\nOrders: ${preTotals.orders}\nItems Sold: ${preTotals.items}\nTotal Sales: ${fmtINR(preTotals.total)}\n\nOnce closed, no more sales can be added to this day.`,
    async ()=>{
      State.busy = true; showLoading(true);
      try {
        const result = await runTransaction(ref(db,'activeBusinessDay'), (current)=>{ if (current !== dayId) return; return null; });
        if (!result.committed) { toast('Business day state changed. Please refresh.','err'); return; }
        const salesSnap = await get(ref(db,'sales'));
        const freshSales = salesSnap.val() || {};
        let totalOrders=0, totalItems=0, totalSales=0;
        const payments = { Cash:0, UPI:0, Card:0, Pending:0 };
        for (const sid in freshSales) {
          const s = freshSales[sid];
          if (s.businessDayId === dayId && !s.cancelled) {
            totalOrders++; totalSales += Number(s.total)||0;
            (s.items||[]).forEach(it => totalItems += Number(it.qty)||0);
            const pm = s.paymentMethod || 'Cash';
            payments[pm] = (payments[pm]||0) + (Number(s.total)||0);
          }
        }
        await update(ref(db,'businessDays/'+dayId), {
          status:'closed', closedAtLocal: Date.now(), closedAtServer: serverTimestamp(),
          closedAtLocalISO: now.toISOString(), closedBy: State.user.uid,
          closedByName: State.profile?.name || '',
          summary: { totalOrders, totalItems, totalSales, payments }
        });
        await recordActivity({ type:'day_closed', description:'Closed business day', recordId: dayId, details:{ totalOrders, totalItems, totalSales } });
        toast('Business day closed');
      } catch (e) { toast('Error: ' + (e.message || e.code || 'unknown'), 'err'); }
      finally { State.busy = false; showLoading(false); }
    }, 'Close Day', true);
};

function todaysScheduledOrders(){
  const bd = activeBusinessDate();
  return Object.entries(State.orders||{}).map(([id,o])=>({id,...o}))
    .filter(o => o.scheduledDate === bd)
    .sort((a,b)=> (a.scheduledTime||'').localeCompare(b.scheduledTime||''));
}
function orderStatusBadge(status){
  const s = status || 'pending';
  if (s === 'completed') return `<span class="badge badge-green">Completed</span>`;
  if (s === 'cancelled') return `<span class="badge badge-red">Cancelled</span>`;
  return `<span class="badge badge-pending">Pending</span>`;
}
function orderDueBucket(o, todayDate, nowHHMM){
  if (o.status !== 'pending') return '';
  if (o.scheduledDate < todayDate) return 'overdue';
  if (o.scheduledDate > todayDate) return 'upcoming';
  if ((o.scheduledTime||'') < nowHHMM) return 'overdue';
  if ((o.scheduledTime||'') >= nowHHMM && (o.scheduledTime||'') <= addMinutes(nowHHMM, 60)) return 'due-soon';
  return 'upcoming';
}
function addMinutes(hhmm, mins){
  if(!hhmm) return hhmm;
  const [h,m] = hhmm.split(':').map(Number);
  let t = (h||0)*60 + (m||0) + mins;
  t = ((t % 1440) + 1440) % 1440;
  return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
}
function renderPinnedOrderReminders(){
  const bd = activeBusinessDate();
  const nowHHMM = new Date().toTimeString().slice(0,5);
  const orders = Object.entries(State.orders||{}).map(([id,o])=>({id,...o}))
    .filter(o => o.status === 'pending')
    .filter(o => {
      if (o.scheduledDate < bd) return true;
      if (o.scheduledDate === bd) return true;
      const diff = (new Date(o.scheduledDate) - new Date(bd)) / (1000*60*60*24);
      return diff <= 7;
    })
    .map(o => ({ ...o, bucket: orderDueBucket(o, bd, nowHHMM) }))
    .sort((a,b)=>{
      const order = { overdue:0, 'due-soon':1, upcoming:2 };
      const cmp = order[a.bucket] - order[b.bucket];
      if (cmp !== 0) return cmp;
      return (a.scheduledDate+a.scheduledTime).localeCompare(b.scheduledDate+b.scheduledTime);
    })
    .slice(0, 8);
  if (!orders.length) return '';
  const pills = orders.map(o=>{
    const itemsSummary = (o.items||[]).slice(0,2).map(i=>`${i.productName} ×${i.qty}`).join(', ') + ((o.items||[]).length>2?` +${o.items.length-2} more`:'');
    const dateLabel = o.scheduledDate === bd ? 'Today' : fmtDate(o.scheduledDate);
    return `<div class="pin-order ${o.bucket}">
      <div class="po-time">${esc(o.scheduledTime||'—')}</div>
      <div class="po-info">
        <b>${esc(o.customerName||'—')} · ${dateLabel}</b>
        <small>${esc(itemsSummary)}</small>
      </div>
      <div class="po-amt">${fmtINR(o.total)}</div>
      <button class="icon-btn" onclick="viewOrderDetails('${o.id}')" title="View">👁️</button>
    </div>`;
  }).join('');
  return `<div class="card" style="margin-bottom:20px;border-left:4px solid var(--orange);">
    <div class="card-title" style="margin-bottom:12px"><span class="chip">📌</span>Pinned Order Reminders</div>
    ${pills}
  </div>`;
}
function renderTodaysScheduledOrders(){
  const bd = activeBusinessDate();
  const list = todaysScheduledOrders();
  if (!list.length) {
    return `<div class="card" style="margin-bottom:20px">
      <div class="card-title"><span class="chip">📅</span>Today's Scheduled Orders</div>
      <div class="empty"><span class="em-icon">📋</span><b>No scheduled orders for today</b>New orders will appear here.</div>
    </div>`;
  }
  const nowHHMM = new Date().toTimeString().slice(0,5);
  const cards = list.map(o=>{
    const bucket = orderDueBucket(o, bd, nowHHMM);
    const cls = o.status==='completed' ? 'completed' : o.status==='cancelled' ? 'cancelled' : (bucket || '');
    const itemsSummary = (o.items||[]).map(i=>`${esc(i.productName)} ×${i.qty}`).join(', ');
    const actions = o.status === 'pending' ? `
      <button class="btn btn-ghost btn-sm" onclick="viewOrderDetails('${o.id}')">View</button>
      <button class="btn btn-ghost btn-sm" onclick="confirmEditOrder('${o.id}')">Edit</button>
      <button class="btn btn-primary btn-sm" onclick="confirmMarkOrderDone('${o.id}')">Mark Done</button>
    ` : `<button class="btn btn-ghost btn-sm" onclick="viewOrderDetails('${o.id}')">View</button>`;
    return `<div class="order-card ${cls}">
      <div class="order-row-top">
        <div style="min-width:0;flex:1">
          <div class="order-id">#${esc((o.orderId||o.id||'').slice(-8))} ${orderStatusBadge(o.status)}</div>
          <div class="order-cust">${esc(o.customerName||'Walk-in')}${o.customerPhone?' · '+esc(o.customerPhone):''}</div>
        </div>
        <div class="order-when ${bucket}">${esc(o.scheduledTime||'—')}</div>
      </div>
      <div class="order-items">${itemsSummary}</div>
      <div class="order-meta">
        <span class="badge badge-orange">${fmtINR(o.total)}</span>
        <span class="badge ${o.paymentMethod==='Pending'?'badge-pending':'badge-teal'}">${esc(o.paymentMethod||'Cash')}</span>
        ${o.note?`<span style="font-size:11.5px;color:var(--muted);font-weight:600">📝 ${esc(o.note.slice(0,40))}${o.note.length>40?'…':''}</span>`:''}
      </div>
      <div class="order-actions">${actions}</div>
    </div>`;
  }).join('');
  return `<div class="card" style="margin-bottom:20px">
    <div class="card-title"><span class="chip">📅</span>Today's Scheduled Orders <span class="badge badge-teal" style="font-family:var(--f-body);font-size:11px">${list.length}</span></div>
    ${cards}
  </div>`;
}

function drawSales7dChart(){
  const ctx = document.getElementById('chart7d'); if(!ctx) return;
  if(State.chartInstances.chart7d) State.chartInstances.chart7d.destroy();
  const labels=[], data=[];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = dateToISO(d);
    labels.push(d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}));
    let dayTotal = 0;
    Object.values(State.sales||{}).forEach(s=>{
      if (s.cancelled) return;
      const bd = s.businessDate || s.date;
      if (bd === iso) dayTotal += Number(s.total)||0;
    });
    data.push(dayTotal);
  }
  const gradient = ctx.getContext('2d').createLinearGradient(0,0,0,240);
  gradient.addColorStop(0,'rgba(255,152,47,.35)');
  gradient.addColorStop(1,'rgba(255,152,47,.02)');
  State.chartInstances.chart7d = new Chart(ctx, {
    type:'bar', data:{ labels, datasets:[{ label:'Sales', data, backgroundColor:gradient, borderColor:'#FF982F', borderWidth:2, borderRadius:10, borderSkipped:false }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{ y:{ beginAtZero:true, ticks:{ callback:v=>'₹'+v, color:'#8C7862', font:{size:11} }, grid:{color:'#F6ECDC'} },
               x:{ ticks:{color:'#8C7862', font:{size:11}}, grid:{display:false} } } }
  });
}
function drawCategoryChart(){

window.dashboardOrdersGoToPage = (p)=>{

function buildPageButtons(current, total, handler){
  if (total <= 1) return '';
  const pages = new Set(); pages.add(1); pages.add(total);
  for (let i = current-2; i <= current+2; i++) if (i >= 1 && i <= total) pages.add(i);
  const sorted = [...pages].sort((a,b)=>a-b);
  const out = []; let prev = 0;
  for (const p of sorted) {
    if (prev && p - prev > 1) out.push(`<span style="color:var(--muted);padding:0 4px">…</span>`);
    out.push(`<button class="pg-btn ${p===current?'active':''}" onclick="${handler}(${p})">${p}</button>`);
    prev = p;
  }
  return out.join('');
}

function addToCart(pid, qty){
  const p = State.products[pid]; if(!p) return;
  const cat = State.categories[p.categoryId] || {name:'Other'};
  const sub = p.subcategoryId ? subName(p.subcategoryId) : (isLegacyProduct(p)?'General':'');
  const price = productPrice(p);
  const existing = State.cart.find(c=>c.pid===pid);
  const curQty = existing ? existing.qty : 0;
  const maxStock = productStock(p);
  if (curQty + qty > maxStock) { toast('Only ' + maxStock + ' in stock (already ' + curQty + ' in cart)', 'err'); return; }
  if(existing) existing.qty += qty;
  else State.cart.push({ pid, productName:p.name, categoryId:p.categoryId, categoryName:cat.name, subcategoryId:p.subcategoryId||'', subcategoryName:sub, price, qty });
  renderCart();
}
function cartSubtotal(){ return State.cart.reduce((a,c)=>a+c.price*c.qty,0); }
function cartDiscountClamped(){ const sub = cartSubtotal(); return Math.min(Math.max(0, Number(State.cartDiscount)||0), sub); }

function renderCart(){
  const el = $('#cartItems'); const cntEl = $('#cartCount'); if(!el) return;
  if(!State.cart.length){ el.innerHTML = '<div class="cart-empty"><span class="em-icon">🛒</span><b>Cart is empty</b>Tap a product to add it.</div>'; }

function updateCartTotals(){
  const subEl = document.getElementById('cartSubtotal');
  const totEl = document.getElementById('cartTotal');
  const sub = cartSubtotal(), disc = cartDiscountClamped(), tot = sub - disc;
  if (subEl) subEl.textContent = fmtINR(sub);
  if (totEl) totEl.textContent = fmtINR(tot);
}
window.changeQty = (i, delta)=>{
  const line = State.cart[i]; if (!line) return;
  if (delta > 0) {
    const p = State.products[line.pid];
    const max = p ? productStock(p) : line.qty;
    if (line.qty + delta > max) { toast('Only ' + max + ' in stock', 'err'); return; }
  }
  line.qty += delta;
  if(line.qty <= 0) State.cart.splice(i,1);
  const sub = cartSubtotal();
  if (State.cartDiscount > sub) State.cartDiscount = sub;
  const dInput = document.getElementById('cartDiscountInput'); if (dInput) dInput.value = State.cartDiscount;
  renderCart();
};

  let d = Number(val); if (isNaN(d) || d < 0) d = 0;
  if (d > sub) { d = sub; const inp = document.getElementById('cartDiscountInput'); if (inp) inp.value = d; }
  State.cartDiscount = d;
  updateCartTotals();
};

window.finalizeSale = async ()=>{
  if (State.busy) return;
  if (!State.activeDayId) { toast('Please start a business day first','err'); return; }
  if (!State.cart.length) { toast('Add items to cart first','err'); return; }
  const activeDay = State.businessDays[State.activeDayId];
  if (!activeDay || activeDay.status !== 'active') { toast('Active business day not found','err'); return; }
  for (const c of State.cart) {
    const p = State.products[c.pid];
    const available = p ? productStock(p) : 0;
    if (available < c.qty) { toast(`Insufficient stock for ${c.productName}`, 'err'); return; }
  }
  const subtotal = cartSubtotal();
  const discount = cartDiscountClamped();
  const total = subtotal - discount;
  const saleId = push(ref(db,'sales')).key;
  State.busy = true; showLoading(true);
  const deductions = [];
  try {
    for (const c of State.cart) {
      const p = State.products[c.pid];
      const from = productStock(p);
      const res = await adjustProductStock(c.pid, -c.qty, { productName:c.productName, from, reason:'Sale '+saleId, refId:saleId });
      if (!res.ok) throw new Error('Stock deduction failed for ' + c.productName);
      deductions.push({ pid:c.pid, qty:c.qty });
    }
    const sale = {
      saleId, type:'regular_sale', businessDayId: State.activeDayId, businessDate: activeDay.businessDate,
      date: activeDay.businessDate, dateTime: nowISO(),
      createdBy: State.user.uid, createdByName: State.profile?.name || '',
      items: State.cart.map(c=>({ pid:c.pid, productName:c.productName, categoryId:c.categoryId, categoryName:c.categoryName, subcategoryId:c.subcategoryId||'', subcategoryName:c.subcategoryName||'', price:c.price, qty:c.qty })),
      subtotal, discount, total,
      paymentMethod: State.posSelectedPay,
      payments: { [State.posSelectedPay]: total },
      note: State.cartNote || '',
      customerId: State.posCustomer?.id || null,
      customerName: State.posCustomer?.name || 'Walk-in',
      cancelled: false,
    };
    await set(ref(db,'sales/'+saleId), sale);
    if(State.posCustomer?.id){
      const c = State.customers[State.posCustomer.id] || {};
      await update(ref(db,'customers/'+State.posCustomer.id), {
        totalPurchases: (Number(c.totalPurchases)||0) + total,
        lastPurchase: activeDay.businessDate
      });
    }
    await recordActivity({
      type:'sale_created',
      description:'Created sale ' + fmtINR(total),
      recordId: saleId,
      diff: buildDiff({}, {
        itemsSummary: summarizeItems(sale.items),
        subtotal, discount, total, paymentMethod: State.posSelectedPay,
        customerName: sale.customerName, note: sale.note
      })
    });
    toast('Sale saved: ' + fmtINR(total));
    State.cart = []; State.cartDiscount = 0; State.cartNote = ''; State.posCustomer = null;
    renderCart();
    const dInput = document.getElementById('cartDiscountInput'); if (dInput) dInput.value = 0;
    const nInput = document.getElementById('cartNote'); if (nInput) nInput.value = '';
  } catch(err){
    for (const d of deductions) { try { await adjustProductStock(d.pid, d.qty, { reason:'Rollback', refId:'rollback-'+saleId }); } catch(_){} }
    toast('Failed: ' + (err.message || err.code || 'unknown'),'err');
  } finally { State.busy = false; showLoading(false); }
};

function renderOrdersProductsOnly(){

window.openOrderProductPicker = (pid)=>{
  const p = State.products[pid]; if(!p) return;

     </div>

    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
