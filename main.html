  $('#actUserFilter').onchange = (e)=>{ State.activityUserFilter = e.target.value; State.activityPage = 1; drawActivityTable(); };
  $('#actDateFilter').onchange = (e)=>{ State.activityDateFilter = e.target.value; State.activityPage = 1; drawActivityTable(); };
  populateActivityUserFilter();
  drawActivityTable();
}
function populateActivityUserFilter(){
  const el = document.getElementById('actUserFilter'); if (!el) return;
  const users = new Set(['All']);
  Object.values(State.activities||{}).forEach(a=>{ if (a.username) users.add(a.username); });
  el.innerHTML = [...users].map(u=>`<option value="${esc(u)}" ${u===State.activityUserFilter?'selected':''}>${esc(u)}</option>`).join('');
}
window.clearActivityFilters = ()=>{
  State.activitySearch = ''; State.activityTypeFilter = 'All'; State.activityUserFilter = 'All';
  State.activityDateFilter = ''; State.activityPage = 1;
  renderActivityLog();
};
function filteredActivities(){
  let list = Object.entries(State.activities||{}).map(([id,a])=>({id,...a}));
  if (State.activityTypeFilter !== 'All') list = list.filter(a=>a.type === State.activityTypeFilter);
  if (State.activityUserFilter !== 'All') list = list.filter(a=>a.username === State.activityUserFilter);
  if (State.activityDateFilter) {
    list = list.filter(a=>{
      const t = a.timestampLocal || a.timestamp;
      if (!t) return false;
      const d = new Date(t);
      if (isNaN(d)) return false;
      return dateToISO(d) === State.activityDateFilter;
    });
  }
  if (State.activitySearch) {
    const q = State.activitySearch.toLowerCase();
    list = list.filter(a=>{
      const hay = [a.description, a.recordId, a.username, a.email, a.type, ...(a.diff ? Object.keys(a.diff) : [])].filter(Boolean).join(' ').toLowerCase();
      if (hay.includes(q)) return true;
      if (a.diff && typeof a.diff === 'object') {
        for (const k in a.diff) {
          const fv = String(a.diff[k]?.from ?? '').toLowerCase();
          const tv = String(a.diff[k]?.to ?? '').toLowerCase();
          if (fv.includes(q) || tv.includes(q)) return true;
        }
      }
      return false;
    });
  }
  list.sort((a,b)=>{
    const ta = typeof a.timestamp === 'number' ? a.timestamp : new Date(a.timestampLocal||a.timestamp||0).getTime();
    const tb = typeof b.timestamp === 'number' ? b.timestamp : new Date(b.timestampLocal||b.timestamp||0).getTime();
    return tb - ta;
  });
  return list;
}
function drawActivityTable(){
  const el = document.getElementById('activityBody'); if (!el) return;
  const list = filteredActivities();
  const total = list.length;
  if (!total) { el.innerHTML = `<div class="empty"><span class="em-icon">📋</span><b>No activities match</b></div>`; return; }
  const totalPages = Math.max(1, Math.ceil(total / State.activityPerPage));
  if (State.activityPage > totalPages) State.activityPage = totalPages;
  if (State.activityPage < 1) State.activityPage = 1;
  const start = (State.activityPage - 1) * State.activityPerPage;
  const pageItems = list.slice(start, start + State.activityPerPage);
  const rows = pageItems.map(a=>{
    const meta = actMeta(a.type);
    const t = a.timestampLocal || a.timestamp;
    const diffCount = a.diff ? Object.keys(a.diff).length : 0;
    return `<tr class="act-row" onclick="viewActivityDetails('${a.id}')">
      <td data-label="Time">${fmtDate(t)}<br><small style="color:var(--muted)">${fmtTime(t)}</small></td>
      <td data-label="User"><div class="act-user"><b>${esc(a.username||'—')}</b><small>${esc(a.role||'')}</small></div></td>
      <td data-label="Activity"><span class="act-type-pill ${meta.cls}">${meta.icon} ${meta.label}</span></td>
      <td data-label="Description">${esc(a.description||'')}${a.recordId?`<br><small style="color:var(--muted);font-family:ui-monospace,monospace">${esc(a.recordId.slice(-12))}</small>`:''}${diffCount?`<br><small style="color:var(--orange);font-weight:700">📝 ${diffCount} field${diffCount===1?'':'s'} changed</small>`:''}</td>
    </tr>`;
  }).join('');
  const perPageOptions = [10,20,30,40,50].map(n=>`<option value="${n}" ${n===State.activityPerPage?'selected':''}>${n} / page</option>`).join('');
  const pageBtns = buildPageButtons(State.activityPage, totalPages, 'activityGoToPage');
  el.innerHTML = `
    <div style="margin-bottom:14px;color:var(--brown);font-size:13px"><b>${total}</b> activit${total===1?'y':'ies'}</div>
    <div class="tbl-wrap"><table class="data">
      <thead><tr><th>Date & Time</th><th>User</th><th>Activity</th><th>Description</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="pagination">
      <div class="pg-info">Showing <b>${start+1}–${Math.min(start+State.activityPerPage, total)}</b> of <b>${total}</b> activities</div>
      <div class="pg-controls">
        <select class="pg-perpage" onchange="activitySetPerPage(this.value)">${perPageOptions}</select>
        <button class="pg-btn" onclick="activityGoToPage(${State.activityPage-1})" ${State.activityPage<=1?'disabled':''}>← Prev</button>
        ${pageBtns}
        <button class="pg-btn" onclick="activityGoToPage(${State.activityPage+1})" ${State.activityPage>=totalPages?'disabled':''}>Next →</button>
      </div>
    </div>`;
}
window.activityGoToPage = (p)=>{
  const total = filteredActivities().length;
  const totalPages = Math.max(1, Math.ceil(total / State.activityPerPage));
  State.activityPage = Math.max(1, Math.min(totalPages, p));
  drawActivityTable();
};
window.activitySetPerPage = (v)=>{ State.activityPerPage = Number(v)||10; State.activityPage = 1; drawActivityTable(); };

window.viewActivityDetails = (id)=>{
  const a = State.activities[id]; if (!a) return;
  const meta = actMeta(a.type);
  const t = a.timestampLocal || a.timestamp;
  let diffHTML = '';
  if (a.diff && typeof a.diff === 'object' && Object.keys(a.diff).length) {
    const keys = FIELD_ORDER.filter(k => k in a.diff);
    Object.keys(a.diff).forEach(k => { if (!keys.includes(k)) keys.push(k); });
    diffHTML = `<div style="margin-top:16px">
      <div style="font-weight:800;color:var(--brown);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Changes (${keys.length})</div>
      <table class="diff-table">
        <thead><tr><th>Field</th><th>Old Value</th><th>New Value</th></tr></thead>
        <tbody>
          ${keys.map(k=>{
            const d = a.diff[k] || {};
            const label = FIELD_LABELS[k] || k;
            const oldV = normalizeVal(k, d.from ?? '');
            const newV = normalizeVal(k, d.to ?? '');
            return `<tr>
              <td class="d-field">${esc(label)}</td>
              <td><span class="d-old">${esc(oldV || '—')}</span></td>
              <td><span class="d-new">${esc(newV || '—')}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
  }
  let detailsHTML = '';
  if (a.details && typeof a.details === 'object' && Object.keys(a.details).length) {
    detailsHTML = `<div style="margin-top:14px">
      <div style="font-weight:800;color:var(--brown);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">Additional Details</div>
      <pre class="act-detail-pre">${esc(JSON.stringify(a.details, null, 2))}</pre>
    </div>`;
  }
  openModal('Activity Details', `
    <div style="margin-bottom:14px;display:flex;align-items:center;gap:10px"><span class="act-type-pill ${meta.cls}">${meta.icon} ${meta.label}</span></div>
    <div style="font-size:13px;color:var(--brown);line-height:1.8">
      <div><b>Description:</b> ${esc(a.description||'—')}</div>
      <div><b>User:</b> ${esc(a.username||'—')} (${esc(a.role||'')})</div>
      <div><b>Email:</b> ${esc(a.email||'—')}</div>
      <div><b>Time:</b> ${fmtDateTime(t)}</div>
      ${a.recordId?`<div><b>Record ID:</b> <code style="background:var(--cream);padding:1px 5px;border-radius:4px;font-size:11.5px">${esc(a.recordId)}</code></div>`:''}
      <div><b>Activity ID:</b> <code style="background:var(--cream);padding:1px 5px;border-radius:4px;font-size:11.5px">${esc(id)}</code></div>
    </div>
    ${diffHTML}
    ${detailsHTML}
  `, `<button class="btn btn-ghost" onclick="closeModal()">Close</button>`);
};

/* ============================================================
   BUSINESS DAY TAB (Admin only)
   ============================================================ */
function renderClosing(){
  if(!isAdmin()){ toast('Access denied','err'); navigateTo('dashboard'); return; }
  const el = $('#pageContent');
  const activeDay = State.activeDay;
  const allDays = Object.entries(State.businessDays||{}).map(([id,d])=>({id,...d}))
    .sort((a,b)=> (b.startAtServer||b.startAtLocal||0) - (a.startAtServer||a.startAtLocal||0));
  if (activeDay) {
    const tot = activeDayTotals();
    const start = getActiveStartMs();
    el.innerHTML = `
      <div class="bd-banner active" style="margin-bottom:18px">
        <div class="bd-banner-info">
          <div class="bd-banner-title">🟢 Business Day Active</div>
          <div class="bd-banner-sub">Date: <b>${fmtDate(activeDay.businessDate)}</b> · Started: <b>${fmtTime(activeDay.startAtLocal || activeDay.startAtServer)}</b></div>
          <div class="bd-banner-sub">Duration: <b id="bdTimer">${fmtDuration(start ? (Date.now()-start) : 0)}</b></div>
        </div>
        <button class="btn btn-danger" onclick="closeBusinessDay()">🔒 Close Day</button>
      </div>
      <div class="stat-grid">
        <div class="stat-card"><div class="sc-label">Orders</div><div class="sc-value">${tot.orders}</div></div>
        <div class="stat-card teal"><div class="sc-label">Items Sold</div><div class="sc-value">${tot.items}</div></div>
        <div class="stat-card green"><div class="sc-label">Total Sales</div><div class="sc-value mono">${fmtINR(tot.total)}</div></div>
        <div class="stat-card red"><div class="sc-label">Pending</div><div class="sc-value mono">${fmtINR(tot.byPay.Pending)}</div></div>
      </div>
      <div class="card" style="margin-bottom:18px">
        <div class="card-title"><span class="chip">💳</span>Payment Collection</div>
        ${Object.entries(tot.byPay).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-2)"><span style="font-weight:600;display:flex;align-items:center;gap:8px">${paymentBadge(k)}</span><b class="mono">${fmtINR(v)}</b></div>`).join('')}
      </div>
      <div class="card">
        <div class="card-title"><span class="chip">📜</span>Business Day History</div>
        ${allDays.length ? renderBusinessDayHistory(allDays.slice(0,20)) : '<div class="empty">No history.</div>'}
      </div>`;
    return;
  }
  el.innerHTML = `
    <div class="bd-banner inactive" style="margin-bottom:18px">
      <div class="bd-banner-info">
        <div class="bd-banner-title">⏸ No Business Day Active</div>
        <div class="bd-banner-sub">Start a new business day to record sales.</div>
      </div>
      <button class="btn btn-primary" onclick="startBusinessDay()">▶ Start Day</button>
    </div>
    <div class="card">
      <div class="card-title"><span class="chip">📜</span>Business Day History</div>
      ${allDays.length ? renderBusinessDayHistory(allDays.slice(0,20)) : '<div class="empty"><span class="em-icon">📜</span><b>No business days yet</b></div>'}
    </div>`;
}
function renderBusinessDayHistory(days){
  if (!days.length) return '<div class="empty" style="padding:20px">No history.</div>';
  return days.map(d=>{
    const start = d.startAtServer || d.startAtLocal;
    const closedAt = d.closedAtLocal || d.closedAtServer;
    const isClosed = d.status === 'closed';
    const summary = d.summary || {};
    return `<div class="day-history-item" style="display:flex;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--cream-2);border-radius:var(--r-sm);border:1px solid var(--line-2);margin-bottom:8px;flex-wrap:wrap;align-items:center;">
      <div style="min-width:0;flex:1">
        <div style="font-weight:800;color:var(--dark);font-size:13.5px;margin-bottom:3px">${fmtDate(d.businessDate)} ${isClosed?'<span class="badge badge-green" style="font-size:10px;margin-left:6px">Closed</span>':'<span class="badge badge-teal" style="font-size:10px;margin-left:6px">Active</span>'}</div>
        <div style="font-size:11.5px;color:var(--muted);font-weight:600">Started ${fmtTime(start)} · ${isClosed?'Closed '+fmtTime(closedAt):'Running'} · ${summary.totalOrders||0} orders</div>
      </div>
      <div style="font-family:var(--f-display);font-size:16px;font-weight:800;color:var(--orange);flex-shrink:0">${fmtINR(summary.totalSales||0)}</div>
    </div>`;
  }).join('');
}

window.exportCSV = (type)=>{
  if(!isAdmin()){ toast('Access denied','err'); return; }
  let rows = []; let filename = 'export.csv';
  if(type==='sales'){
    filename = `sales_${todayISO()}.csv`;
    rows.push(['Type','Business Date','Time','Customer','Items','Subtotal','Discount','Total','Payment','Staff','Note','Business Day ID']);
    Object.values(State.sales).forEach(s=>{
      const items = (s.items||[]).map(i=>`${i.productName}${i.subcategoryName?'('+i.subcategoryName+')':''} x${i.qty}`).join('; ');
      rows.push([s.type||'regular_sale', s.businessDate||s.date||'', fmtTime(s.dateTime), s.customerName||'Walk-in', items,
        s.subtotal!=null?s.subtotal:'', s.discount||0, s.total||0, s.paymentMethod||'', s.createdByName||'', s.note||'', s.businessDayId||'']);
    });
  } else if(type==='expenses'){
    filename = `expenses_${todayISO()}.csv`;
    rows.push(['Date','Category','Description','Payment','Amount']);
    Object.values(State.expenses).forEach(e=>{
      rows.push([e.date||'', e.category||'', e.description||'', e.paymentMethod||'', e.amount||0]);
    });
  }
  const csv = rows.map(r=>r.map(v=>{
    const s = String(v??'');
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
  URL.revokeObjectURL(link.href);
  toast('CSV downloaded');
};
</script>
